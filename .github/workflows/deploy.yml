name: Deploy to GitHub Pages
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://www.compliance365.com.au
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages if the repo's Pages site isn't provisioned yet,
          # instead of hard-failing with "Get Pages site failed / verify that
          # the repository has Pages enabled" — GitHub's own error message
          # recommends this parameter for exactly that case. Also survives the
          # transient "No server is currently available" Pages-API blips.
          enablement: true

      - name: Clean previous build output
        run: |
          rm -rf dist
          rm -rf .astro
          echo "Cleaned dist/ and .astro/"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (include dev)
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=dev
          else
            npm i --include=dev
          fi

      - name: Show package scripts & Astro version
        run: |
          node -v
          npm -v
          node -e "try{console.log(require('./package.json').scripts)}catch(e){console.error('No package.json?')}"
          npx astro --version || true
          npm ls @astrojs/sitemap || true

      - name: Write module keys for premium content pack encryption
        # build-content-packs.mjs (below) reads a FILE at tools/module-keys.json,
        # not an env var — gitignored on purpose (see .gitignore), since it's the
        # decryption key material for every premium framework's content. Written
        # here from a repo secret only for the duration of this job; never
        # committed. The empty-secret check happens in the shell, not via a step
        # `if:` — GitHub Actions rejects `secrets.*` referenced directly in a
        # step's `if:` condition at workflow-parse time (the whole run fails
        # before any job even schedules, not just this step). An empty/missing
        # secret is NOT a failure either way — build-content-packs.mjs's own
        # existsSync() check just skips pack-building entirely when the file
        # was never written, same as a contributor's local checkout with no
        # keys, and the shell app + ISO 27001 baseline still deploys fine.
        run: |
          if [ -n "$MODULE_KEYS_JSON" ]; then
            printf '%s' "$MODULE_KEYS_JSON" > tools/module-keys.json
          else
            echo "No MODULE_KEYS_JSON secret set — premium content packs will be skipped this build."
          fi
        env:
          MODULE_KEYS_JSON: ${{ secrets.MODULE_KEYS_JSON }}

      - name: Build (force Astro)
        run: npx astro build --verbose
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Minify Checkpoint's own JavaScript
        # MUST run before the hashing step below, never after: hashing
        # computes each file's content hash and the matching SRI digest,
        # so minifying afterwards would change the bytes the browser
        # receives and every integrity check would fail.
        #
        # This is the third manual re-implementation of a package.json
        # postbuild step in this job (see the comment on the content-pack
        # step below): `npx astro build` does not fire npm's postbuild
        # lifecycle script, so anything added to that script has to be
        # added here too. It was not when minification landed, which is
        # why production kept serving ~2.2 MB of unminified source while
        # local `npm run build` produced 1.2 MB. Nothing was visibly
        # broken by that — it is purely transfer size — so there was no
        # symptom to notice; if you add another postbuild step, add it
        # here as well.
        run: node scripts/minify-checkpoint-assets.mjs

      - name: Content-hash Checkpoint's own assets + regenerate SRI
        run: node scripts/hash-checkpoint-assets.mjs

      - name: Checkout premium content (compliance-365/Checkpoint-Content)
        # Premium framework source (SOC 2, Essential Eight, ISO 42001,
        # ISO 27701, DISP/IRAP, NIST CSF, RFFR, CPS 234, AI) used to be
        # plaintext JSON committed right here in checkpoint-content/,
        # which meant anyone could read licensed content in this public
        # repo. It now lives in the private compliance-365/Checkpoint-Content
        # repo instead, checked out here into the exact path
        # build-content-packs.mjs already reads (join(process.cwd(),
        # 'checkpoint-content')) — no change to that script needed.
        #
        # Unlike the MODULE_KEYS_JSON step below, this is NOT allowed to
        # fail quietly. That step's graceful skip exists for a
        # contributor/fork building this repo without Compliance365's
        # private key material, which is a genuinely supported case —
        # the shell app still builds. This checkout has no equivalent
        # excuse: every merge to main on THIS repo, deploying to
        # production, always had this content available before the
        # move. A checkout failure here — wrong/missing/expired PAT,
        # wrong repo — must fail the build loudly, not silently ship
        # zero premium content to every paying tenant while CI stays
        # green. See the assertion step immediately below.
        uses: actions/checkout@v4
        with:
          repository: compliance-365/Checkpoint-Content
          token: ${{ secrets.CHECKPOINT_CONTENT_PAT }}
          path: checkpoint-content

      - name: Assert premium content checkout is complete
        # A checkout that "succeeds" but lands 0 or partial files (a
        # stale/mis-scoped PAT, a sparse-checkout config on the source
        # repo, a silently-truncated clone) would let the step above go
        # green while build-content-packs.mjs's own existsSync() guard
        # treats a merely-empty directory as "nothing to build" and
        # moves on without error — exactly the silent-failure shape
        # this step exists to close off. Checking each expected
        # filename catches a partial checkout a bare file-count would
        # miss.
        run: |
          set -e
          missing=""
          for f in ai.json cps234.json dispirap.json essential8.json is18.json iso27701.json iso42001.json nistcsf.json rffr.json soc2.json; do
            if [ ! -s "checkpoint-content/$f" ]; then
              missing="$missing $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "ERROR: checkpoint-content/ checkout is missing or has empty files:$missing"
            echo "This means every premium framework would silently ship with no content."
            echo "Check the CHECKPOINT_CONTENT_PAT secret and the checkout step above."
            exit 1
          fi
          echo "Premium content checkout verified — all 10 framework files present ✅"

      - name: Build encrypted premium content packs
        # `npx astro build` above does NOT run npm's postbuild lifecycle script
        # (that only fires for `npm run build`) — this step and the one above
        # are the manual equivalent of package.json's postbuild for CI. Without
        # this, dist/checkpoint/packs/manifest.json never gets created and
        # every premium framework (SOC2, ISO42001, Essential Eight, ISO27701,
        # DISP/IRAP, NIST CSF) silently stays unavailable to every tenant,
        # ISO 27001-baseline readiness aside — exactly the "Sync issue:
        # mergeLicensedPacks: could not load packs/manifest.json" a live tenant
        # hit, and exactly why this step was missing: the workflow already had
        # its hash-checkpoint-assets.mjs equivalent above, but nothing ever
        # added this one alongside it.
        run: node scripts/build-content-packs.mjs

      - name: Ensure .nojekyll (avoid GitHub Pages quirks)
        run: |
          touch dist/.nojekyll

      - name: Debug build output
        run: |
          echo "=== dist root ==="
          ls -la dist || true
          echo "=== find any sitemap files ==="
          find dist -maxdepth 2 -type f -iname "sitemap*.xml" -print || true

      - name: Generate sitemap fallback if missing
        run: |
          set -e
          if compgen -G "dist/sitemap-index.xml" > /dev/null || compgen -G "dist/sitemap-*.xml" > /dev/null || [ -f dist/sitemap.xml ]; then
            echo "Astro sitemap exists; no fallback needed."
            exit 0
          fi
          echo "No Astro sitemap found. Generating fallback sitemap..."
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find dist -type f -name "*.html" | while read -r f; do
              p="${f#dist/}"
              if [ "${p##*/}" = "index.html" ]; then
                loc="/${p%index.html}"
              else
                loc="/${p}"
              fi
              loc="$(echo "$loc" | sed 's#//\+#/#g')"
              lm="$(date -u -r "$f" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "  <url><loc>${SITE}${loc}</loc><lastmod>${lm}</lastmod></url>"
            done
            echo '</urlset>'
          } > dist/sitemap.xml
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo "  <sitemap><loc>${SITE}/sitemap.xml</loc></sitemap>"
            echo '</sitemapindex>'
          } > dist/sitemap-index.xml
          echo "Fallback sitemap generated at dist/sitemap.xml and dist/sitemap-index.xml"

      - name: Assert sitemap exists (any valid output)
        run: |
          if compgen -G "dist/sitemap-index.xml" > /dev/null || \
             compgen -G "dist/sitemap-*.xml" > /dev/null || \
             [ -f dist/sitemap.xml ]; then
            echo "Sitemap ready ✅"
          else
            echo "ERROR: No sitemap files produced."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 15000
