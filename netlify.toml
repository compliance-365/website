[build]
  command = "npx astro build && node scripts/indexnow-submit.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Apex domain → www — ensures compliance365.com.au always redirects to
# www.compliance365.com.au, preventing Google from seeing the apex as an
# "alternate" URL with a conflicting canonical tag
[[redirects]]
  from = "https://compliance365.com.au/*"
  to = "https://www.compliance365.com.au/:splat"
  status = 301
  force = true

# Trailing-slash redirects — ensures non-trailing-slash URLs get a clean 301
# instead of Netlify's implicit redirect, which Google can flag as a redirect error

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/"
  status = 301
  force = false

[[redirects]]
  from = "/services/:slug"
  to = "/services/:slug/"
  status = 301
  force = false

[[redirects]]
  from = "/checklist/:slug"
  to = "/checklist/:slug/"
  status = 301
  force = false

[[redirects]]
  from = "/resources/:slug"
  to = "/resources/:slug/"
  status = 301
  force = false

[[redirects]]
  from = "/case-studies/:slug"
  to = "/case-studies/:slug/"
  status = 301
  force = false

[[redirects]]
  from = "/locations/:slug"
  to = "/locations/:slug/"
  status = 301
  force = false

[[redirects]]
  from = "/posture-scan"
  to = "/posture-scan/"
  status = 301
  force = false

[[redirects]]
  from = "/checkpoint-console"
  to = "/checkpoint-console/"
  status = 301
  force = false

[[redirects]]
  from = "/free-roadmap"
  to = "/free-roadmap/"
  status = 301
  force = false

[[redirects]]
  from = "/book"
  to = "/book/"
  status = 301
  force = false

# /results/ never existed as a page — the homepage briefly linked to it
# instead of /case-studies/ (fixed in the template), but old bookmarks,
# backlinks or cached marketing collateral may still hit it.
[[redirects]]
  from = "/results/"
  to = "/case-studies/"
  status = 301
  force = false

[[redirects]]
  from = "/results"
  to = "/case-studies/"
  status = 301
  force = false

[[redirects]]
  from = "/404.html"
  to = "/"
  status = 301
  force = false

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
