      <stop offset="1" stop-color="#D8BA78" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-sydney"><rect width="720" height="470" rx="26"/></clipPath>
  </defs>

  <rect width="720" height="470" rx="26" fill="url(#bg-sydney)"/>

