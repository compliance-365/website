  <line x1="0" y1="248" x2="880" y2="248" stroke="#f1f5f9"/>
  <text x="16" y="223" font-size="11" font-weight="700" fill="#1e293b">A.8.1</text>
  <text x="16" y="239" font-size="10" fill="#64748b">ISMS — Clause 8.1</text>
