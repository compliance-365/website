<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="gce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="20" fill="url(#gce)"/>

  <!-- Left: the five control themes -->
  <g transform="translate(80,60)" font-family="Inter, system-ui" font-size="13">
    <rect width="380" height="300" rx="14" fill="#fff" stroke="#e8ebf3"/>
    <text x="24" y="34" font-weight="700" fill="#0B0B0C" font-size="15">Five control themes</text>
    <rect x="24" y="48" width="180" height="10" rx="5" fill="#F5F0E8"/>

    <g font-family="Inter, system-ui" font-size="12.5">
      <g transform="translate(24,74)">
        <rect x="-4" y="-4" width="332" height="34" rx="8" fill="#F5F0E8"/>
        <circle cx="13" cy="13" r="8" fill="#10B981"/>
        <path d="M9 13l3 3 5-5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="17" fill="#0B0B0C" font-weight="600">Secure configuration</text>
      </g>
      <g transform="translate(24,114)">
        <rect x="-4" y="-4" width="332" height="34" rx="8" fill="#F5F0E8"/>
        <circle cx="13" cy="13" r="8" fill="#10B981"/>
        <path d="M9 13l3 3 5-5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="17" fill="#0B0B0C" font-weight="600">Security update management</text>
      </g>
      <g transform="translate(24,154)">
        <rect x="-4" y="-4" width="332" height="34" rx="8" fill="#F5F0E8"/>
        <circle cx="13" cy="13" r="8" fill="#10B981"/>
        <path d="M9 13l3 3 5-5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="17" fill="#0B0B0C" font-weight="600">User access control</text>
      </g>
      <g transform="translate(24,194)">
        <rect x="-4" y="-4" width="332" height="34" rx="8" fill="#F5F0E8"/>
        <circle cx="13" cy="13" r="8" fill="#10B981"/>
        <path d="M9 13l3 3 5-5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="17" fill="#0B0B0C" font-weight="600">Malware protection</text>
      </g>
      <g transform="translate(24,234)">
        <rect x="-4" y="-4" width="332" height="34" rx="8" fill="#F5F0E8"/>
        <circle cx="13" cy="13" r="8" fill="none" stroke="#8B6820" stroke-width="1.6"/>
        <text x="32" y="17" fill="#0B0B0C" font-weight="600">Firewalls</text>
      </g>
    </g>
    <text x="24" y="284" fill="#6B6860" font-size="11">Four of five automated from your M365 tenant</text>
