<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="NIST CSF 2.0 — 6 functions: Govern, Identify, Protect, Detect, Respond, Recover">
  <defs>
    <!-- Brand gradient -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Soft background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" stop-opacity=".06"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity=".06"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".10"/>
    </filter>
    <style>
      .title { font: 800 18px/1 Nunito, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill:#4F46E5; }
      .subtitle { font: 12px/1.2 Nunito, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill:#64748b; }
      .label { font: 800 14px/1 Nunito, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill:#0f172a; }
      .chip { font: 600 11px/1 Nunito, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill:#0f172a; }
    </style>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="640" height="420" rx="16" fill="url(#bg)"/>

  <!-- Donut baseline -->
  <circle cx="320" cy="210" r="120" fill="none" stroke="#eef2ff" stroke-width="32"/>

  <!-- Segmented ring (6 equal parts with small gaps)
       Circumference ≈ 2πr = 753.98; we’ll use dasharray 110/16 (segment/gap) and offset per segment -->
  <g fill="none" stroke="url(#brand)" stroke-width="32" stroke-linecap="round" filter="url(#shadow)">
    <circle cx="320" cy="210" r="120" stroke-dasharray="110 16" stroke-dashoffset="0"/>     <!-- Govern -->
    <circle cx="320" cy="210" r="120" stroke-dasharray="110 16" stroke-dashoffset="126"/>   <!-- Identify -->
    <circle cx="320" cy="210" r="120" stroke-dasharray="110 16" stroke-dashoffset="252"/>   <!-- Protect -->
    <circle cx="320" cy="210" r="120" stroke-dasharray="110 16" stroke-dashoffset="378"/>   <!-- Detect -->
    <circle cx="320" cy="210" r="120" stroke-dasharray="110 16" stroke-dashoffset="504"/>   <!-- Respond -->
    <circle cx="320" cy="210" r="120" stroke-dasharray="110 16" stroke-dashoffset="630"/>   <!-- Recover -->
  </g>

  <!-- Center title -->
  <g text-anchor="middle">
    <text class="title" x="320" y="206">NIST CSF 2.0</text>
    <text class="subtitle" x="320" y="224">6 Core Functions</text>
  </g>

  <!-- Function labels (evenly spaced) -->
  <g class="label">
    <text x="320" y="56" text-anchor="middle">Govern</text>
    <text x="490" y="96">Identify</text>
    <text x="568" y="218">Protect</text>
    <text x="492" y="340">Detect</text>
    <text x="320" y="378" text-anchor="middle">Respond</text>
    <text x="148" y="340" text-anchor="end">Recover</text>
  </g>

  <!-- Tiny helper chips (domain breakdown) -->
  <!-- Top (Govern) -->
  <g transform="translate(320 84)" text-anchor="middle">
    <rect x="-64" y="8" rx="8" ry="8" width="128" height="20" fill="#fff" stroke="#e5e7eb"/>
    <text class="chip" x="0" y="22">Strategy · Roles · Metrics</text>
  </g>
  <!-- Identify -->
  <g transform="translate(492 120)">
    <rect x="0" y="0" rx="8" ry="8" width="150" height="20" fill="#fff" stroke="#e5e7eb"/>
    <text class="chip" x="8" y="14">Assets · Business Context</text>
  </g>
  <!-- Protect -->
  <g transform="translate(498 236)">
    <rect x="0" y="0" rx="8" ry="8" width="126" height="20" fill="#fff" stroke="#e5e7eb"/>
    <text class="chip" x="8" y="14">Access · Hardening</text>
  </g>
  <!-- Detect -->
  <g transform="translate(470 320)">
    <rect x="0" y="0" rx="8" ry="8" width="152" height="20" fill="#fff" stroke="#e5e7eb"/>
    <text class="chip" x="8" y="14">Monitoring · Alerts</text>
  </g>
  <!-- Respond -->
  <g transform="translate(256 356)">
    <rect x="-88" y="0" rx="8" ry="8" width="176" height="20" fill="#fff" stroke="#e5e7eb"/>
    <text class="chip" x="0" y="14" text-anchor="middle">IR Plan · Comms · Legal</text>
  </g>
  <!-- Recover -->
  <g transform="translate(120 320)">
    <rect x="-160" y="0" rx="8" ry="8" width="160" height="20" fill="#fff" stroke="#e5e7eb"/>
    <text class="chip" x="-80" y="14" text-anchor="middle">Backups · Lessons</text>
  </g>
</svg>
