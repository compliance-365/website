<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-canberra d-canberra">
  <title id="t-canberra">Compliance365 in Canberra</title>
  <desc id="d-canberra">A stylised Canberra skyline beneath a card listing the compliance frameworks most requested by ACT organisations: IRAP, DISP, Essential 8 ML2.</desc>
  <defs>
    <linearGradient id="bg-canberra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="glow-canberra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8BA78" stop-opacity=".38"/>
      <stop offset="1" stop-color="#D8BA78" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame-canberra"><rect width="720" height="470" rx="26"/></clipPath>
  </defs>

  <rect width="720" height="470" rx="26" fill="url(#bg-canberra)"/>

  <g clip-path="url(#frame-canberra)">
    <!-- horizon glow behind the skyline -->
    <ellipse cx="360" cy="396" rx="330" ry="150" fill="url(#glow-canberra)"/>

    <!-- skyline -->
    <g font-family="Inter, system-ui, Segoe UI, Roboto, sans-serif">
      <rect x="74" y="304" width="34" height="92" rx="3" fill="#0B0B0C" opacity="1"/><rect x="81.0" y="320" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="81.0" y="333" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="96.0" y="333" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="96.0" y="346" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="81.0" y="359" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/>
    <!-- Black Mountain and Telstra Tower -->
    <g opacity=".9">
      <path d="M104 396 Q158 350 212 396 Z" fill="#0B0B0C" opacity=".22"/>
      <path d="M158 362 V238" stroke="#0B0B0C" stroke-width="7"/>
      <rect x="139" y="264" width="38" height="11" rx="5" fill="#A9812E"/>
      <rect x="145" y="278" width="26" height="9" rx="4" fill="#0B0B0C"/>
      <path d="M158 238 V210" stroke="#0B0B0C" stroke-width="3"/>
      <circle cx="158" cy="206" r="4" fill="#A9812E"/>
    </g>
    <!-- Parliament House: low wings, colonnade, flagpole -->
    <g opacity=".96">
      <rect x="248" y="344" width="244" height="52" rx="4" fill="#0B0B0C"/>
      <rect x="266" y="354" width="8" height="32" rx="2" fill="#D8BA78" opacity=".38"/><rect x="293" y="354" width="8" height="32" rx="2" fill="#D8BA78" opacity=".38"/><rect x="320" y="354" width="8" height="32" rx="2" fill="#D8BA78" opacity=".38"/><rect x="347" y="354" width="8" height="32" rx="2" fill="#D8BA78" opacity=".38"/><rect x="374" y="354" width="8" height="32" rx="2" fill="#D8BA78" opacity=".38"/><rect x="401" y="354" width="8" height="32" rx="2" fill="#D8BA78" opacity=".38"/><rect x="428" y="354" width="8" height="32" rx="2" fill="#D8BA78" opacity=".38"/><rect x="455" y="354" width="8" height="32" rx="2" fill="#D8BA78" opacity=".38"/>
      <rect x="304" y="322" width="132" height="22" rx="3" fill="#0B0B0C" opacity=".88"/>
      <path d="M336 322 L370 244 M404 322 L370 244
               M352 322 L370 244 M388 322 L370 244"
            stroke="#0B0B0C" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M370 244 V218" stroke="#0B0B0C" stroke-width="4"/>
      <path d="M370 218 L408 228 L370 238 Z" fill="#A9812E"/>
    </g>
    <rect x="516" y="284" width="38" height="112" rx="3" fill="#0B0B0C" opacity="1"/><rect x="523.0" y="300" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="542.0" y="300" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="523.0" y="313" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="542.0" y="313" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="523.0" y="326" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="542.0" y="326" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="523.0" y="339" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="542.0" y="339" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="523.0" y="352" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="542.0" y="352" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/>
    <rect x="564" y="250" width="32" height="146" rx="3" fill="#0B0B0C" opacity="1"/><rect x="571.0" y="266" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="571.0" y="279" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="584.0" y="279" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="584.0" y="292" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="571.0" y="305" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="571.0" y="318" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="584.0" y="318" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="584.0" y="331" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/>
    <rect x="606" y="298" width="40" height="98" rx="3" fill="#0B0B0C" opacity="1"/><rect x="613.0" y="314" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="634.0" y="314" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="613.0" y="327" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="634.0" y="327" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="613.0" y="340" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="634.0" y="340" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="613.0" y="353" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="634.0" y="353" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/>
    </g>

    <!-- ground band -->
    <rect x="0" y="396" width="720" height="74" fill="#0B0B0C" opacity=".06"/>
    <rect x="0" y="396" width="720" height="3" fill="#A9812E" opacity=".55"/>
  </g>

  <!-- framework card -->
  <g font-family="Inter, system-ui, Segoe UI, Roboto, sans-serif">
    <rect x="40" y="36" width="416" height="112" rx="16" fill="#ffffff" stroke="#F5F0E8"/>
    <text x="64" y="70" font-size="19" font-weight="800" fill="#0B0B0C">Canberra</text>
    <text x="64" y="92" font-size="12.5" fill="#6B6860">Most requested in ACT</text>
    <g transform="translate(64,106)"><g transform="translate(0.0,0)">
        <rect width="42.4" height="26" rx="13" fill="#A9812E" opacity=".12"/>
        <text x="21.2" y="17" text-anchor="middle" font-size="11.5" font-weight="700" fill="#A9812E">IRAP</text>
      </g><g transform="translate(50.4,0)">
        <rect width="42.4" height="26" rx="13" fill="#A9812E" opacity=".12"/>
        <text x="21.2" y="17" text-anchor="middle" font-size="11.5" font-weight="700" fill="#A9812E">DISP</text>
      </g><g transform="translate(100.8,0)">
        <rect width="115.0" height="26" rx="13" fill="#A9812E" opacity=".12"/>
        <text x="57.5" y="17" text-anchor="middle" font-size="11.5" font-weight="700" fill="#A9812E">Essential 8 ML2</text>
      </g></g>
  </g>

  <!-- fixed-price badge -->
  <g font-family="Inter, system-ui, Segoe UI, Roboto, sans-serif">
    <rect x="512" y="36" width="168" height="60" rx="14" fill="#0B0B0C"/>
    <text x="596" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#D8BA78" letter-spacing="1.4">FIXED-PRICE</text>
    <text x="596" y="81" text-anchor="middle" font-size="12" fill="#FAF7F1" opacity=".72">10–14 weeks</text>
  </g>
</svg>
