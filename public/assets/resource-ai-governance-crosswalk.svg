<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="gcw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="20" fill="url(#gcw)"/>

  <g font-family="Inter, system-ui" font-size="12.5">
    <!-- ISO 42001 -->
    <g transform="translate(60,56)">
      <rect width="270" height="300" rx="14" fill="#fff" stroke="#e8ebf3"/>
      <rect x="0" y="0" width="270" height="46" rx="14" fill="#A9812E"/>
      <rect x="0" y="30" width="270" height="16" fill="#A9812E"/>
      <text x="20" y="30" fill="#fff" font-weight="700" font-size="14">ISO/IEC 42001</text>
      <text x="20" y="70" fill="#8B6820" font-weight="700" font-size="11">CERTIFIABLE STANDARD</text>
      <text x="20" y="96" fill="#0B0B0C" font-size="11.5">Two-stage external audit</text>
      <text x="20" y="118" fill="#0B0B0C" font-size="11.5">Full Annex A control set</text>
      <text x="20" y="140" fill="#0B0B0C" font-size="11.5">3-year certificate</text>
      <rect x="20" y="164" width="230" height="1" fill="#F5F0E8"/>
      <text x="20" y="188" fill="#6B6860" font-size="11">References NIST AI RMF</text>
      <text x="20" y="206" fill="#6B6860" font-size="11">as a normative source</text>
      <rect x="20" y="228" width="230" height="52" rx="8" fill="#FBF0DD"/>
      <text x="32" y="250" fill="#8B6820" font-weight="700" font-size="11">Sits at the centre —</text>
      <text x="32" y="266" fill="#8B6820" font-size="10.5">absorbs the other two as you build it</text>
    </g>

    <!-- NIST AI RMF -->
    <g transform="translate(345,56)">
      <rect width="270" height="300" rx="14" fill="#fff" stroke="#e8ebf3"/>
      <rect x="0" y="0" width="270" height="46" rx="14" fill="#0B0B0C"/>
      <rect x="0" y="30" width="270" height="16" fill="#0B0B0C"/>
      <text x="20" y="30" fill="#fff" font-weight="700" font-size="14">NIST AI RMF</text>
      <text x="20" y="70" fill="#6B6860" font-weight="700" font-size="11">VOLUNTARY METHODOLOGY</text>
      <text x="20" y="96" fill="#0B0B0C" font-size="11.5">Govern · Map</text>
      <text x="20" y="118" fill="#0B0B0C" font-size="11.5">Measure · Manage</text>
      <text x="20" y="140" fill="#0B0B0C" font-size="11.5">No certification exists</text>
      <rect x="20" y="164" width="230" height="1" fill="#F5F0E8"/>
      <text x="20" y="188" fill="#6B6860" font-size="11">US-origin risk</text>
      <text x="20" y="206" fill="#6B6860" font-size="11">management vocabulary</text>
    </g>

    <!-- EU AI Act -->
    <g transform="translate(630,56)">
      <rect width="270" height="300" rx="14" fill="#fff" stroke="#e8ebf3"/>
      <rect x="0" y="0" width="270" height="46" rx="14" fill="#8B6820"/>
      <rect x="0" y="30" width="270" height="16" fill="#8B6820"/>
      <text x="20" y="30" fill="#fff" font-weight="700" font-size="14">EU AI Act</text>
      <text x="20" y="70" fill="#8B6820" font-weight="700" font-size="11">BINDING REGULATION</text>
      <text x="20" y="96" fill="#0B0B0C" font-size="11.5">Applies by where output</text>
      <text x="20" y="114" fill="#0B0B0C" font-size="11.5">is used, not HQ location</text>
      <text x="20" y="140" fill="#0B0B0C" font-size="11.5">Enforceable penalties</text>
      <rect x="20" y="164" width="230" height="1" fill="#F5F0E8"/>
      <text x="20" y="188" fill="#6B6860" font-size="11">Art. 40: harmonised</text>
      <text x="20" y="206" fill="#6B6860" font-size="11">standards presumption</text>
      <rect x="20" y="228" width="230" height="52" rx="8" fill="#F5F0E8"/>
      <text x="32" y="250" fill="#0B0B0C" font-weight="700" font-size="11">High-risk Annex III</text>
      <text x="32" y="266" fill="#6B6860" font-size="10.5">deferred to 2 Dec 2027</text>
    </g>

    <!-- connecting lines -->
    <g stroke="#D8BA78" stroke-width="2" fill="none">
      <path d="M330 206 L345 206"/>
      <path d="M615 206 L630 206"/>
    </g>
  </g>

  <text x="50%" y="392" font-family="Inter, system-ui" font-size="20" text-anchor="middle" fill="#0B0B0C" font-weight="700">
    One regulation, one methodology, one certifiable standard
  </text>
</svg>
