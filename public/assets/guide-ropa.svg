<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="bgRopa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <!-- Gradient frame -->
  <rect width="960" height="420" rx="18" fill="url(#bgRopa)"/>

  <!-- App surface -->
  <g transform="translate(36,36)">
    <rect width="888" height="348" rx="16" fill="#ffffff" stroke="#e8ebf5"/>

    <!-- Title tag -->
    <rect x="24" y="20" width="260" height="28" rx="8" fill="#eef2ff" stroke="#dfe5ff"/>
    <rect x="292" y="20" width="120" height="28" rx="8" fill="#f2f5ff" stroke="#e6eafe"/>

    <!-- Main table (ROPA register) -->
    <g transform="translate(24,72)">
      <rect width="520" height="244" rx="12" fill="#f9fbff" stroke="#e6e9f2"/>
      <!-- table header -->
      <rect x="12" y="12" width="160" height="18" rx="5" fill="#eaf0ff"/>
      <rect x="184" y="12" width="140" height="18" rx="5" fill="#eef2ff"/>
      <rect x="336" y="12" width="160" height="18" rx="5" fill="#eef2ff"/>
      <!-- rows -->
      <g fill="#ffffff" stroke="#edf0f6">
        <rect x="12"  y="44"  width="496" height="44" rx="8"/>
        <rect x="12"  y="96"  width="496" height="44" rx="8"/>
        <rect x="12"  y="148" width="496" height="44" rx="8"/>
        <rect x="12"  y="200" width="496" height="32" rx="8"/>
      </g>
      <!-- tiny field chips -->
      <g fill="#e9eefc">
        <rect x="24"  y="56" width="90" height="10" rx="5"/>
        <rect x="130" y="56" width="74" height="10" rx="5"/>
        <rect x="216" y="56" width="110" height="10" rx="5"/>
        <rect x="24"  y="108" width="120" height="10" rx="5"/>
        <rect x="154" y="108" width="98"  height="10" rx="5"/>
        <rect x="24"  y="160" width="160" height="10" rx="5"/>
      </g>
    </g>

    <!-- Right detail panes -->
    <g transform="translate(564,72)">
      <rect width="336" height="104" rx="12" fill="#f9fbff" stroke="#e6e9f2"/>
      <rect x="0" y="124" width="336" height="120" rx="12" fill="#f9fbff" stroke="#e6e9f2"/>

      <!-- “Good vs risky” checklist (top) -->
      <g transform="translate(14,16)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- good -->
        <rect x="-6" y="-6" width="28" height="28" rx="6" fill="#eef2ff" stroke="#dfe5ff"/>
        <path d="M0 8 l6 6 l12 -12" stroke="#4F46E5" stroke-width="2"/>
        <rect x="38" y="2" width="120" height="10" rx="5" fill="#e9eefc" stroke="none"/>
        <!-- risky -->
        <rect x="0" y="44" width="16" height="16" rx="4" fill="#fff4f4" stroke="#f4d6d6"/>
        <path d="M2 58 l12 -12" stroke="#d34040" stroke-width="2"/>
        <path d="M14 58 l-12 -12" stroke="#d34040" stroke-width="2"/>
        <rect x="38" y="50" width="140" height="10" rx="5" fill="#f4e9ff" stroke="none"/>
      </g>

      <!-- Data lifecycle bullets (bottom) -->
      <g transform="translate(14,142)" fill="#e9eefc">
        <rect y="0"   width="160" height="10" rx="5"/>
        <rect y="28"  width="200" height="10" rx="5"/>
        <rect y="56"  width="130" height="10" rx="5"/>
      </g>
    </g>
  </g>

  <!-- Caption -->
  <text x="56" y="386" font-family="system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif"
        font-size="18" fill="#4F46E5" font-weight="700">What a Good ROPA Looks Like</text>
</svg>
