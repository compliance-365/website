  <line x1="0" y1="156" x2="880" y2="156" stroke="#f1f5f9"/>
  <text x="16" y="131" font-size="11" font-weight="700" fill="#1e293b">A.5.1</text>
  <text x="16" y="147" font-size="10" fill="#64748b">ISMS — Clause 5.1</text>
  <text x="110" y="134" font-size="11" fill="#1e293b">Policies for Information Security</text>
  <rect x="376" y="123" width="80" height="20" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
