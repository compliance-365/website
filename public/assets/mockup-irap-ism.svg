  <rect y="182" width="880" height="36" fill="white"/>
  <line x1="0" y1="218" x2="880" y2="218" stroke="#f1f5f9"/>
  <text x="16" y="204" font-size="10.5" fill="#1e293b" font-weight="700">ISM-0837</text>
  <text x="104" y="204" font-size="11" fill="#1e293b">Patch Management</text>
  <rect x="348" y="191" width="64" height="18" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="380" y="204" font-size="9.5" fill="#1d4ed8" text-anchor="middle">Endpoint</text>
  <rect x="446" y="191" width="76" height="18" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="484" y="204" font-size="9.5" fill="#166534" text-anchor="middle">&#10003; Compliant</text>
  <text x="572" y="204" font-size="10.5" fill="#374151">WSUS / Intune</text>
  <rect x="748" y="191" width="46" height="18" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="771" y="204" font-size="9.5" fill="#dc2626" text-anchor="middle">High</text>

  <!-- ROW 4: ISM-1055 Privileged Access -->
  <rect y="218" width="880" height="36" fill="#fafafa"/>
  <line x1="0" y1="254" x2="880" y2="254" stroke="#f1f5f9"/>
  <text x="16" y="240" font-size="10.5" fill="#1e293b" font-weight="700">ISM-1055</text>
  <text x="104" y="240" font-size="11" fill="#1e293b">Privileged Access Management</text>
  <rect x="348" y="227" width="62" height="18" rx="9" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="379" y="240" font-size="9.5" fill="#7c3aed" text-anchor="middle">Identity</text>
  <rect x="446" y="227" width="58" height="18" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="475" y="240" font-size="9.5" fill="#c2410c" text-anchor="middle">&#9651; Gap</text>
