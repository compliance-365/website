<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
  <defs>
    <linearGradient id="gcs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity=".1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#gcs)"/>

  <g font-family="Inter, system-ui" font-size="14">
    <!-- Three framework cards -->
    <g transform="translate(90,80)">
      <rect width="300" height="180" rx="14" fill="#fff" stroke="#e8ebf3"/>
      <rect width="300" height="46" rx="14" fill="#0B0B0C"/>
      <rect y="30" width="300" height="16" fill="#0B0B0C"/>
      <text x="20" y="30" fill="#fff" font-weight="700" font-size="15">ISO 27001</text>
      <text x="20" y="68" fill="#6B6860" font-weight="700" font-size="11">ISMS</text>
      <text x="20" y="94" fill="#0B0B0C" font-size="12">Already certified</text>
      <text x="20" y="116" fill="#0B0B0C" font-size="12">and operating</text>
      <text x="20" y="150" fill="#8B6820" font-size="11" font-weight="700">Foundation</text>
    </g>

    <g transform="translate(450,80)">
      <rect width="300" height="180" rx="14" fill="#fff" stroke="#e8ebf3"/>
      <rect width="300" height="46" rx="14" fill="#A9812E"/>
      <rect y="30" width="300" height="16" fill="#A9812E"/>
      <text x="20" y="30" fill="#fff" font-weight="700" font-size="15">ISO 27701</text>
      <text x="20" y="68" fill="#8B6820" font-weight="700" font-size="11">PIMS</text>
      <text x="20" y="94" fill="#0B0B0C" font-size="12">Privacy extension —</text>
      <text x="20" y="116" fill="#0B0B0C" font-size="12">ROPA, DPIAs</text>
      <text x="20" y="150" fill="#8B6820" font-size="11" font-weight="700">Built in 20 weeks</text>
    </g>

    <g transform="translate(810,80)">
      <rect width="300" height="180" rx="14" fill="#fff" stroke="#e8ebf3"/>
      <rect width="300" height="46" rx="14" fill="#8B6820"/>
      <rect y="30" width="300" height="16" fill="#8B6820"/>
      <text x="20" y="30" fill="#fff" font-weight="700" font-size="15">ISO 42001</text>
      <text x="20" y="68" fill="#8B6820" font-weight="700" font-size="11">AIMS</text>
      <text x="20" y="94" fill="#0B0B0C" font-size="12">AI governance —</text>
      <text x="20" y="116" fill="#0B0B0C" font-size="12">inventory, oversight</text>
      <text x="20" y="150" fill="#8B6820" font-size="11" font-weight="700">Built in 20 weeks</text>
    </g>

    <!-- connecting lines down to shared core -->
    <g stroke="#D8BA78" stroke-width="2" fill="none">
      <path d="M240 260 L240 300 L600 300 L600 320"/>
      <path d="M600 260 L600 300"/>
      <path d="M960 260 L960 300 L600 300"/>
    </g>

    <!-- shared management system core -->
    <g transform="translate(340,330)">
      <rect width="520" height="130" rx="16" fill="#FBF0DD" stroke="#D8BA78"/>
      <text x="260" y="40" text-anchor="middle" fill="#0B0B0C" font-weight="700" font-size="16">Shared management system core</text>
      <text x="260" y="66" text-anchor="middle" fill="#8B6820" font-size="12">Leadership · Risk register · Internal audit · Management review</text>
      <text x="260" y="98" text-anchor="middle" fill="#0B0B0C" font-weight="700" font-size="13">~50% of the AIMS "hard work" — already in place</text>
    </g>
  </g>

  <text x="50%" y="524" font-family="Inter, system-ui" font-size="22" text-anchor="middle" fill="#0B0B0C" font-weight="700">
    One management system, extended twice — not rebuilt twice
  </text>
</svg>
