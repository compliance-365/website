<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="cr-title cr-desc" font-family="Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="cr-title">The ComplianceReady System — 4 Clear Phases</title>
  <desc id="cr-desc">Four-phase compliance methodology: Assess, Implement, Evidence, and Certify. Each phase shows a key question and outcome statement.</desc>

  <!-- Header -->
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#0B0B0C">The ComplianceReady System</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" font-weight="500" fill="#6B6860" letter-spacing="0.5">FOUR PHASES — EVIDENCE AT EVERY STEP</text>

  <!-- Phase 1: Assess -->
  <g transform="translate(40, 120)">
    <rect width="260" height="380" rx="14" fill="#ffffff" stroke="#DDD8CF" stroke-width="1"/>

    <!-- Phase number tab -->
    <rect x="20" y="20" width="56" height="24" rx="12" fill="#BE4A1E"/>
    <text x="48" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">01</text>

    <!-- Phase title -->
    <text x="20" y="76" font-size="20" font-weight="700" fill="#0B0B0C">Assess</text>
    <text x="20" y="100" font-size="13" fill="#6B6860">Weeks 1–2</text>

    <!-- Divider -->
    <line x1="20" y1="116" x2="240" y2="116" stroke="#DDD8CF" stroke-width="1"/>

    <!-- Key question -->
    <text x="20" y="142" font-size="11" font-weight="700" fill="#BE4A1E" letter-spacing="0.8">KEY QUESTION</text>
    <text x="20" y="166" font-size="13" fill="#0B0B0C" font-weight="500">
      <tspan x="20" dy="0">What's in scope, what risks</tspan>
      <tspan x="20" dy="18">matter, and how close are we</tspan>
      <tspan x="20" dy="18">to compliance today?</tspan>
    </text>

    <!-- Outcome -->
    <rect x="20" y="232" width="220" height="128" rx="8" fill="#EAF4EF" stroke="#9FD3BF" stroke-width="1"/>
    <text x="32" y="254" font-size="11" font-weight="700" fill="#046A4E" letter-spacing="0.8">OUTCOME</text>
    <text x="32" y="276" font-size="12" fill="#046A4E">
      <tspan x="32" dy="0">A prioritised view of risks,</tspan>
      <tspan x="32" dy="16">scope, obligations, and a</tspan>
      <tspan x="32" dy="16">baseline for certification —</tspan>
      <tspan x="32" dy="16">delivered as a roadmap, not</tspan>
      <tspan x="32" dy="16">a 100-page report.</tspan>
    </text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(308, 305)">
    <path d="M 0 0 L 16 6 L 0 12 Z" fill="#BE4A1E"/>
    <line x1="-8" y1="6" x2="0" y2="6" stroke="#BE4A1E" stroke-width="2"/>
  </g>

  <!-- Phase 2: Implement -->
  <g transform="translate(330, 120)">
    <rect width="260" height="380" rx="14" fill="#ffffff" stroke="#DDD8CF" stroke-width="1"/>

    <rect x="20" y="20" width="56" height="24" rx="12" fill="#BE4A1E"/>
    <text x="48" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">02</text>

    <text x="20" y="76" font-size="20" font-weight="700" fill="#0B0B0C">Implement</text>
    <text x="20" y="100" font-size="13" fill="#6B6860">Weeks 3–10</text>

    <line x1="20" y1="116" x2="240" y2="116" stroke="#DDD8CF" stroke-width="1"/>

    <text x="20" y="142" font-size="11" font-weight="700" fill="#BE4A1E" letter-spacing="0.8">KEY QUESTION</text>
    <text x="20" y="166" font-size="13" fill="#0B0B0C" font-weight="500">
      <tspan x="20" dy="0">What do we need to build,</tspan>
      <tspan x="20" dy="18">configure, or document — without</tspan>
      <tspan x="20" dy="18">overbuilding?</tspan>
    </text>

    <rect x="20" y="232" width="220" height="128" rx="8" fill="#EAF4EF" stroke="#9FD3BF" stroke-width="1"/>
    <text x="32" y="254" font-size="11" font-weight="700" fill="#046A4E" letter-spacing="0.8">OUTCOME</text>
    <text x="32" y="276" font-size="12" fill="#046A4E">
      <tspan x="32" dy="0">A working management system</tspan>
      <tspan x="32" dy="16">with controls, policies, evidence,</tspan>
      <tspan x="32" dy="16">and governance — all running</tspan>
      <tspan x="32" dy="16">inside your existing Microsoft</tspan>
      <tspan x="32" dy="16">365 environment.</tspan>
    </text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(598, 305)">
    <path d="M 0 0 L 16 6 L 0 12 Z" fill="#BE4A1E"/>
    <line x1="-8" y1="6" x2="0" y2="6" stroke="#BE4A1E" stroke-width="2"/>
  </g>

  <!-- Phase 3: Evidence -->
  <g transform="translate(620, 120)">
    <rect width="260" height="380" rx="14" fill="#ffffff" stroke="#DDD8CF" stroke-width="1"/>

    <rect x="20" y="20" width="56" height="24" rx="12" fill="#BE4A1E"/>
    <text x="48" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">03</text>

    <text x="20" y="76" font-size="20" font-weight="700" fill="#0B0B0C">Evidence</text>
    <text x="20" y="100" font-size="13" fill="#6B6860">Continuous</text>

    <line x1="20" y1="116" x2="240" y2="116" stroke="#DDD8CF" stroke-width="1"/>

    <text x="20" y="142" font-size="11" font-weight="700" fill="#BE4A1E" letter-spacing="0.8">KEY QUESTION</text>
    <text x="20" y="166" font-size="13" fill="#0B0B0C" font-weight="500">
      <tspan x="20" dy="0">If an auditor reviewed us</tspan>
      <tspan x="20" dy="18">tomorrow, would we pass —</tspan>
      <tspan x="20" dy="18">and why?</tspan>
    </text>

    <rect x="20" y="232" width="220" height="128" rx="8" fill="#EAF4EF" stroke="#9FD3BF" stroke-width="1"/>
    <text x="32" y="254" font-size="11" font-weight="700" fill="#046A4E" letter-spacing="0.8">OUTCOME</text>
    <text x="32" y="276" font-size="12" fill="#046A4E">
      <tspan x="32" dy="0">QA-reviewed audit packs at</tspan>
      <tspan x="32" dy="16">every milestone. Evidence</tspan>
      <tspan x="32" dy="16">captured at the point of</tspan>
      <tspan x="32" dy="16">change — never reconstructed</tspan>
      <tspan x="32" dy="16">the night before an audit.</tspan>
    </text>
  </g>

  <!-- Arrow 3→4 -->
  <g transform="translate(888, 305)">
    <path d="M 0 0 L 16 6 L 0 12 Z" fill="#BE4A1E"/>
    <line x1="-8" y1="6" x2="0" y2="6" stroke="#BE4A1E" stroke-width="2"/>
  </g>

  <!-- Phase 4: Certify (highlighted as final state) -->
  <g transform="translate(910, 120)">
    <rect width="260" height="380" rx="14" fill="#BE4A1E" stroke="#BE4A1E" stroke-width="1"/>

    <rect x="20" y="20" width="56" height="24" rx="12" fill="#ffffff"/>
    <text x="48" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#BE4A1E" letter-spacing="0.5">04</text>

    <text x="20" y="76" font-size="20" font-weight="700" fill="#ffffff">Certify</text>
    <text x="20" y="100" font-size="13" fill="rgba(255,255,255,0.75)">External audit</text>

    <line x1="20" y1="116" x2="240" y2="116" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <text x="20" y="142" font-size="11" font-weight="700" fill="rgba(255,255,255,0.85)" letter-spacing="0.8">KEY QUESTION</text>
    <text x="20" y="166" font-size="13" fill="#ffffff" font-weight="500">
      <tspan x="20" dy="0">Are we ready to demonstrate</tspan>
      <tspan x="20" dy="18">compliance to an external</tspan>
      <tspan x="20" dy="18">auditor with confidence?</tspan>
    </text>

    <rect x="20" y="232" width="220" height="128" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="32" y="254" font-size="11" font-weight="700" fill="rgba(255,255,255,0.9)" letter-spacing="0.8">OUTCOME</text>
    <text x="32" y="276" font-size="12" fill="#ffffff">
      <tspan x="32" dy="0">A supported certification audit</tspan>
      <tspan x="32" dy="16">with no surprises — resulting</tspan>
      <tspan x="32" dy="16">in ISO certification across</tspan>
      <tspan x="32" dy="16">security, privacy, and/or AI.</tspan>
      <tspan x="32" dy="16" font-weight="700">100% first-time pass.</tspan>
    </text>
  </g>

</svg>
