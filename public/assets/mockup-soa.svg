  <rect x="476" y="261" width="96" height="20" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="524" y="275" font-size="10" fill="#166534" text-anchor="middle">&#10003; Implemented</text>
