<!-- Cover: NIST CSF 2.0 — current profile vs target profile across the six functions -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Manrope, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BE4A1E" stop-opacity=".12"/><stop offset="1" stop-color="#F0A97F" stop-opacity=".10"/></linearGradient></defs><rect width="960" height="420" rx="20" fill="url(#bg)"/>
  <g transform="translate(60,48)">
    <rect width="840" height="324" rx="16" fill="#fff" stroke="#EDE6DA"/>
    <text x="28" y="40" font-size="13" font-weight="800" fill="#A63A12" letter-spacing="2">NIST CSF 2.0 · PROFILE, NOT A CERTIFICATE</text>
    <g font-size="11" font-weight="700" fill="#6B6860"><text x="210" y="74">Tier 1 Partial</text><text x="375" y="74">Tier 2 Risk-informed</text><text x="560" y="74">Tier 3 Repeatable</text><text x="730" y="74">Tier 4 Adaptive</text></g>
    <g font-size="14" font-weight="800" fill="#0B0B0C">
      <g transform="translate(28,92)"><text y="18">Govern</text><rect x="180" y="6" width="600" height="14" rx="7" fill="#F5F0E8"/><rect x="180" y="6" width="230" height="14" rx="7" fill="#BE4A1E"/><circle cx="640" cy="13" r="8" fill="#fff" stroke="#0B0B0C" stroke-width="3"/></g>
      <g transform="translate(28,128)"><text y="18">Identify</text><rect x="180" y="6" width="600" height="14" rx="7" fill="#F5F0E8"/><rect x="180" y="6" width="330" height="14" rx="7" fill="#BE4A1E"/><circle cx="640" cy="13" r="8" fill="#fff" stroke="#0B0B0C" stroke-width="3"/></g>
      <g transform="translate(28,164)"><text y="18">Protect</text><rect x="180" y="6" width="600" height="14" rx="7" fill="#F5F0E8"/><rect x="180" y="6" width="420" height="14" rx="7" fill="#BE4A1E"/><circle cx="640" cy="13" r="8" fill="#fff" stroke="#0B0B0C" stroke-width="3"/></g>
      <g transform="translate(28,200)"><text y="18">Detect</text><rect x="180" y="6" width="600" height="14" rx="7" fill="#F5F0E8"/><rect x="180" y="6" width="280" height="14" rx="7" fill="#BE4A1E"/><circle cx="560" cy="13" r="8" fill="#fff" stroke="#0B0B0C" stroke-width="3"/></g>
      <g transform="translate(28,236)"><text y="18">Respond</text><rect x="180" y="6" width="600" height="14" rx="7" fill="#F5F0E8"/><rect x="180" y="6" width="200" height="14" rx="7" fill="#BE4A1E"/><circle cx="560" cy="13" r="8" fill="#fff" stroke="#0B0B0C" stroke-width="3"/></g>
      <g transform="translate(28,272)"><text y="18">Recover</text><rect x="180" y="6" width="600" height="14" rx="7" fill="#F5F0E8"/><rect x="180" y="6" width="250" height="14" rx="7" fill="#BE4A1E"/><circle cx="560" cy="13" r="8" fill="#fff" stroke="#0B0B0C" stroke-width="3"/></g>
    </g>
  </g>
  <g font-size="12" font-weight="700" fill="#4A4740" transform="translate(60,398)">
    <rect y="-11" width="28" height="12" rx="6" fill="#BE4A1E"/><text x="36">Current profile</text>
    <circle cx="170" cy="-5" r="7" fill="#fff" stroke="#0B0B0C" stroke-width="3"/><text x="184">Target profile</text>
