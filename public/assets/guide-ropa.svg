<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity=".14"/>
    </linearGradient>
  </defs>

  <!-- Outer glow card -->
  <rect x="0" y="0" width="960" height="420" rx="18" fill="url(#bg)"/>

  <!-- App surface -->
  <g transform="translate(32,28)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <rect x="0" y="0" width="896" height="340" rx="14" fill="#fff" stroke="#F5F0E8"/>

    <!-- Title pill -->
    <g transform="translate(20,16)">
      <rect width="220" height="28" rx="8" fill="#F5F0E8" stroke="#F5F0E8"/>
      <text x="12" y="19" font-size="13" fill="#A9812E" font-weight="700">ROPA — Record of Processing</text>
    </g>

    <!-- Left: big table -->
    <g transform="translate(20,64)" fill="none" stroke="#F5F0E8">
      <rect x="0" y="0" width="500" height="248" rx="10" fill="#fff"/>
      <!-- header -->
      <rect x="0" y="0" width="500" height="40" rx="10" fill="#F5F0E8" stroke="#F5F0E8"/>
      <text x="14" y="24" font-size="12" fill="#0B0B0C">Processing Activity</text>
      <text x="206" y="24" font-size="12" fill="#0B0B0C">Purpose</text>
      <text x="350" y="24" font-size="12" fill="#0B0B0C">Lawful Basis</text>

      <!-- rows -->
      <g font-size="12" fill="#0B0B0C">
        <line x1="0" y1="72" x2="500" y2="72"/>
        <line x1="0" y1="112" x2="500" y2="112"/>
        <line x1="0" y1="152" x2="500" y2="152"/>
        <line x1="0" y1="192" x2="500" y2="192"/>
        <text x="14" y="62">Customer onboarding</text>
        <text x="206" y="62">Account creation</text>
        <text x="350" y="62">Contract</text>

        <text x="14" y="102">Billing &amp; invoicing</text>
        <text x="206" y="102">Payment processing</text>
        <text x="350" y="102">Legal obligation</text>

        <text x="14" y="142">Product analytics</text>
        <text x="206" y="142">Service improvement</text>
        <text x="350" y="142">Legitimate interests</text>

        <text x="14" y="182">Marketing emails</text>
        <text x="206" y="182">Promotions / updates</text>
        <text x="350" y="182">Consent</text>
      </g>
    </g>

    <!-- Right: key panels -->
    <g transform="translate(540,64)">
      <!-- Data categories -->
      <rect width="336" height="84" rx="10" fill="#fff" stroke="#F5F0E8"/>
      <text x="14" y="22" font-size="12" fill="#6B6860">Personal data categories</text>
      <g font-size="12" fill="#0B0B0C">
        <text x="14" y="44">Identifiers (name, email, ID)</text>
        <text x="14" y="64">Auth data (account, roles)</text>
        <text x="14" y="84">Usage / telemetry (pseudonymised)</text>
      </g>

      <!-- Recipients -->
      <g transform="translate(0,100)">
        <rect width="336" height="84" rx="10" fill="#fff" stroke="#F5F0E8"/>
        <text x="14" y="22" font-size="12" fill="#6B6860">Recipients &amp; transfers</text>
        <g font-size="12" fill="#0B0B0C">
          <text x="14" y="44">Internal: Support, Finance</text>
          <text x="14" y="64">External: Payment processor (sub-processor)</text>
        </g>
      </g>

      <!-- Retention & security -->
      <g transform="translate(0,200)">
        <rect width="336" height="112" rx="10" fill="#fff" stroke="#F5F0E8"/>
        <text x="14" y="22" font-size="12" fill="#6B6860">Retention &amp; security</text>
        <g font-size="12" fill="#0B0B0C">
          <text x="14" y="44">Retention: 7 years (billing); 24 months (analytics)</text>
          <text x="14" y="64">Security: MFA, encryption at rest, role-based access</text>
          <text x="14" y="84">DPIA needed: Marketing &amp; AI enrichment</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer label -->
  <text x="42" y="388" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="16" fill="#A9812E" font-weight="700">
    What a Good ROPA Looks Like — example structure
  </text>
</svg>
