        <g transform="translate(20,98)"><rect width="210" height="60" rx="12" fill="#FAF7F1"/><text x="16" y="36">DISP</text><circle cx="186" cy="30" r="10" fill="#10B981"/><path d="M181 30l4 4 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g transform="translate(20,172)"><rect width="210" height="60" rx="12" fill="#FAF7F1"/><text x="16" y="36">RFFR</text><circle cx="186" cy="30" r="10" fill="#10B981"/><path d="M181 30l4 4 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
