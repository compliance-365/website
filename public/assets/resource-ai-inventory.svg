<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="gai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="20" fill="url(#gai)"/>

  <g transform="translate(80,56)" font-family="Inter, system-ui" font-size="12.5">
    <rect width="800" height="300" rx="14" fill="#fff" stroke="#e8ebf3"/>
    <text x="24" y="34" font-weight="700" fill="#0B0B0C" font-size="15">AI system inventory</text>

    <!-- header row -->
    <g transform="translate(24,54)" fill="#6B6860" font-size="10.5" font-weight="700">
      <text x="0" y="0">SYSTEM</text>
      <text x="230" y="0">RISK TIER</text>
      <text x="360" y="0">OVERSIGHT</text>
      <text x="530" y="0">OWNER</text>
      <text x="660" y="0">STATUS</text>
    </g>
    <rect x="24" y="64" width="728" height="1" fill="#DDD8CF"/>

    <!-- rows -->
    <g transform="translate(24,86)">
      <text y="0" fill="#0B0B0C" font-weight="600">Clinical decision support</text>
      <rect x="230" y="-14" width="70" height="20" rx="10" fill="#FBF0DD"/>
      <text x="265" y="0" fill="#8B6820" font-weight="700" font-size="10.5" text-anchor="middle">High</text>
      <text x="360" y="0" fill="#6B6860">Reviewer sign-off</text>
      <text x="530" y="0" fill="#6B6860">C. Nguyen</text>
      <circle cx="668" cy="-4" r="5" fill="#10B981"/>
      <text x="680" y="0" fill="#6B6860">Reviewed</text>
    </g>
    <g transform="translate(24,124)">
      <text y="0" fill="#0B0B0C" font-weight="600">Document summarisation</text>
      <rect x="230" y="-14" width="70" height="20" rx="10" fill="#F5F0E8"/>
      <text x="265" y="0" fill="#6B6860" font-weight="700" font-size="10.5" text-anchor="middle">Limited</text>
      <text x="360" y="0" fill="#6B6860">Spot-check</text>
      <text x="530" y="0" fill="#6B6860">R. Patel</text>
      <circle cx="668" cy="-4" r="5" fill="#10B981"/>
      <text x="680" y="0" fill="#6B6860">Reviewed</text>
    </g>
    <g transform="translate(24,162)">
      <text y="0" fill="#0B0B0C" font-weight="600">Copilot (M365)</text>
      <rect x="230" y="-14" width="70" height="20" rx="10" fill="#F5F0E8"/>
      <text x="265" y="0" fill="#6B6860" font-weight="700" font-size="10.5" text-anchor="middle">Minimal</text>
      <text x="360" y="0" fill="#6B6860">N/A</text>
      <text x="530" y="0" fill="#6B6860">IT Governance</text>
      <circle cx="668" cy="-4" r="5" fill="#10B981"/>
      <text x="680" y="0" fill="#6B6860">Reviewed</text>
    </g>
    <g transform="translate(24,200)" opacity="0.7">
      <text y="0" fill="#0B0B0C" font-weight="600">Unnamed AI app (Entra consent)</text>
      <rect x="230" y="-14" width="70" height="20" rx="10" fill="#F5F0E8"/>
      <text x="265" y="0" fill="#6B6860" font-weight="700" font-size="10.5" text-anchor="middle">TBD</text>
      <text x="360" y="0" fill="#6B6860">—</text>
      <text x="530" y="0" fill="#6B6860">Unassigned</text>
      <circle cx="668" cy="-4" r="5" fill="none" stroke="#8B6820" stroke-width="1.6"/>
      <text x="680" y="0" fill="#8B6820" font-weight="600">Discovered</text>
    </g>

    <rect x="24" y="228" width="728" height="52" rx="10" fill="#FBF0DD"/>
    <text x="40" y="250" fill="#8B6820" font-weight="700" font-size="12">Discovered, not just declared</text>
    <text x="40" y="268" fill="#8B6820" font-size="11">Candidate systems surfaced from Entra enterprise app consents</text>
  </g>

  <text x="50%" y="392" font-family="Inter, system-ui" font-size="20" text-anchor="middle" fill="#0B0B0C" font-weight="700">
    What a good AI system inventory looks like
  </text>
</svg>
