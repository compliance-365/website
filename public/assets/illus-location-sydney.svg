        <text x="37.7" y="17" text-anchor="middle" font-size="11.5" font-weight="700" fill="#A9812E">ISO 42001</text>
      </g></g>
  </g>

  <!-- fixed-price badge -->
  <g font-family="Inter, system-ui, Segoe UI, Roboto, sans-serif">
    <rect x="512" y="36" width="168" height="60" rx="14" fill="#0B0B0C"/>
