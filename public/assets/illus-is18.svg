<!-- public/assets/illus-is18.svg — IS18 v10: five policy requirements, then the reporting obligations -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Manrope, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BE4A1E" stop-opacity=".16"/><stop offset="1" stop-color="#0B0B0C" stop-opacity=".16"/></linearGradient></defs><rect width="720" height="470" rx="26" fill="url(#g)"/>
  <!-- Title card -->
  <g transform="translate(40,34)">
    <rect width="640" height="74" rx="14" fill="#fff"/>
    <text x="22" y="30" font-size="11.5" font-weight="700" fill="#A63A12" letter-spacing="1.6">IS18 · QUEENSLAND GOVERNMENT · VERSION 10</text>
    <text x="22" y="56" font-family="Bricolage Grotesque, Manrope, system-ui, sans-serif" font-size="21" font-weight="700" fill="#0B0B0C">Information and cyber security policy</text>
    <rect x="510" y="22" width="108" height="30" rx="15" fill="#FBEFE8"/>
    <text x="564" y="42" text-anchor="middle" font-size="12" font-weight="800" fill="#A63A12">5 requirements</text>
  </g>
  <!-- The five requirements -->
  <g text-anchor="middle">
    <g transform="translate(40,124)"><rect width="120" height="178" rx="12" fill="#fff"/><circle cx="60" cy="36" r="20" fill="#FBEFE8"/><text x="60" y="42" font-size="17" font-weight="800" fill="#A63A12">1</text><text x="60" y="84" font-size="13.5" font-weight="800" fill="#0B0B0C">ISMS</text><text x="60" y="104" font-size="10.5" font-weight="600" fill="#57534B">Based on</text><text x="60" y="118" font-size="10.5" font-weight="600" fill="#57534B">ISO 27001</text><rect x="22" y="140" width="76" height="8" rx="4" fill="#F5F0E8"/><rect x="22" y="140" width="62" height="8" rx="4" fill="#10B981"/><text x="60" y="166" font-size="10" font-weight="700" fill="#6B6860">Scope · SoA · audit</text></g>
    <g transform="translate(170,124)"><rect width="120" height="178" rx="12" fill="#fff"/><circle cx="60" cy="36" r="20" fill="#FBEFE8"/><text x="60" y="42" font-size="17" font-weight="800" fill="#A63A12">2</text><text x="60" y="84" font-size="13.5" font-weight="800" fill="#0B0B0C">Risk</text><text x="60" y="104" font-size="10.5" font-weight="600" fill="#57534B">Built into</text><text x="60" y="118" font-size="10.5" font-weight="600" fill="#57534B">corporate risk</text><rect x="22" y="140" width="76" height="8" rx="4" fill="#F5F0E8"/><rect x="22" y="140" width="50" height="8" rx="4" fill="#10B981"/><text x="60" y="166" font-size="10" font-weight="700" fill="#6B6860">IT and OT</text></g>
    <g transform="translate(300,124)"><rect width="120" height="178" rx="12" fill="#fff"/><circle cx="60" cy="36" r="20" fill="#FBEFE8"/><text x="60" y="42" font-size="17" font-weight="800" fill="#A63A12">3</text><text x="60" y="78" font-size="13.5" font-weight="800" fill="#0B0B0C">Minimum</text><text x="60" y="94" font-size="13.5" font-weight="800" fill="#0B0B0C">requirements</text><text x="60" y="112" font-size="10.5" font-weight="600" fill="#57534B">QGISCF · E8</text><text x="60" y="126" font-size="10.5" font-weight="600" fill="#57534B">DES · QGAF</text><rect x="22" y="140" width="76" height="8" rx="4" fill="#F5F0E8"/><rect x="22" y="140" width="34" height="8" rx="4" fill="#F59E0B"/><text x="60" y="166" font-size="10" font-weight="700" fill="#6B6860">Target you select</text></g>
    <g transform="translate(430,124)"><rect width="120" height="178" rx="12" fill="#fff"/><circle cx="60" cy="36" r="20" fill="#FBEFE8"/><text x="60" y="42" font-size="17" font-weight="800" fill="#A63A12">4</text><text x="60" y="84" font-size="13.5" font-weight="800" fill="#0B0B0C">Assurance</text><text x="60" y="104" font-size="10.5" font-weight="600" fill="#57534B">Scaled to</text><text x="60" y="118" font-size="10.5" font-weight="600" fill="#57534B">criticality</text><rect x="22" y="140" width="76" height="8" rx="4" fill="#F5F0E8"/><rect x="22" y="140" width="42" height="8" rx="4" fill="#F59E0B"/><text x="60" y="166" font-size="10" font-weight="700" fill="#6B6860">Annual simulation</text></g>
    <g transform="translate(560,124)"><rect width="120" height="178" rx="12" fill="#fff"/><circle cx="60" cy="36" r="20" fill="#BE4A1E"/><text x="60" y="42" font-size="17" font-weight="800" fill="#fff">5</text><text x="60" y="84" font-size="13.5" font-weight="800" fill="#0B0B0C">Attestation</text><text x="60" y="104" font-size="10.5" font-weight="600" fill="#57534B">Accountable</text><text x="60" y="118" font-size="10.5" font-weight="600" fill="#57534B">officer signs</text><path d="M30 146 q10 -12 20 0 t20 0 t20 0" fill="none" stroke="#0B0B0C" stroke-width="2" stroke-linecap="round"/><text x="60" y="166" font-size="10" font-weight="700" fill="#6B6860">Departures recorded</text></g>
  </g>
  <!-- Reporting obligations -->
  <g transform="translate(40,318)">
    <rect width="640" height="118" rx="14" fill="#0B0B0C"/>
    <text x="22" y="30" font-size="11.5" font-weight="700" fill="#F0A97F" letter-spacing="1.6">REPORTING TO THE CYBER SECURITY UNIT</text>
    <g font-size="12" font-weight="700" fill="#FAF7F1">
      <rect x="22" y="46" width="186" height="52" rx="10" fill="#BE4A1E"/><text x="38" y="68">Annual return</text><text x="38" y="86" font-size="11" font-weight="600" fill="#FBEFE8">Due 30 September</text>
      <rect x="220" y="46" width="128" height="52" rx="10" fill="#26231F"/><text x="236" y="68">Incidents</text><text x="236" y="86" font-size="11" font-weight="600" fill="#C9C3B8">Earliest opportunity</text>
      <rect x="360" y="46" width="128" height="52" rx="10" fill="#26231F"/><text x="376" y="68">Offshore storage</text><text x="376" y="86" font-size="11" font-weight="600" fill="#C9C3B8">Higher-impact info</text>
      <rect x="500" y="46" width="118" height="52" rx="10" fill="#26231F"/><text x="516" y="68">ICT profiling</text><text x="516" y="86" font-size="11" font-weight="600" fill="#C9C3B8">As required</text>
    </g>
  </g>
</svg>
