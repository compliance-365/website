<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" role="img" aria-labelledby="pims-title pims-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="pims-title">Integrated ISMS + PIMS — Sample Architecture</title>
  <desc id="pims-desc">Diagram showing how an ISO 27001 Information Security Management System and ISO 27701 Privacy Information Management System share underlying infrastructure including risk registers, policy framework, evidence pack, and audit infrastructure.</desc>

  <!-- Card background -->
  <rect x="20" y="20" width="520" height="600" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(44, 48)">
    <rect width="36" height="36" rx="8" fill="#1e40af"/>
    <text x="18" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">365</text>

    <text x="52" y="14" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.2">INTEGRATED MANAGEMENT SYSTEM</text>
    <text x="52" y="32" font-size="18" font-weight="700" fill="#1e3a8a">ISO 27001 + ISO 27701</text>
  </g>

  <!-- Divider -->
  <line x1="44" y1="106" x2="516" y2="106" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top: two parallel management systems -->
  <g transform="translate(44, 128)">
    <!-- ISMS card -->
    <rect x="0" y="0" width="226" height="84" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="14" y="22" font-size="10" font-weight="700" fill="#1e40af" letter-spacing="0.8">ISMS</text>
    <text x="14" y="44" font-size="14" font-weight="700" fill="#1e3a8a">ISO 27001</text>
    <text x="14" y="62" font-size="11" fill="#475569">Information Security</text>
    <text x="14" y="76" font-size="10" fill="#64748b">Annex A controls · CIA · ISMS</text>

    <!-- PIMS card -->
    <rect x="246" y="0" width="226" height="84" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="260" y="22" font-size="10" font-weight="700" fill="#15803d" letter-spacing="0.8">PIMS</text>
    <text x="260" y="44" font-size="14" font-weight="700" fill="#14532d">ISO 27701</text>
    <text x="260" y="62" font-size="11" fill="#475569">Privacy Management</text>
    <text x="260" y="76" font-size="10" fill="#64748b">DPIAs · ROPAs · Rights · DPAs</text>
  </g>

  <!-- Connector lines down to shared infrastructure -->
  <g transform="translate(44, 220)">
    <line x1="113" y1="0" x2="113" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="359" y1="0" x2="359" y2="22" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="113" y1="22" x2="359" y2="22" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="236" y1="22" x2="236" y2="38" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- "Shared" label -->
  <g transform="translate(44, 268)">
    <rect x="148" y="-10" width="176" height="22" rx="11" fill="#1e40af"/>
    <text x="236" y="5" text-anchor="middle" font-size="10" font-weight="700" fill="white" letter-spacing="1">SHARED INFRASTRUCTURE</text>
  </g>

  <!-- Shared infrastructure rows -->
  <g transform="translate(44, 300)">
    <!-- Risk register -->
    <rect x="0" y="0" width="472" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="20" font-size="12" font-weight="700" fill="#0f172a">Risk register</text>
    <text x="14" y="34" font-size="10" fill="#64748b">Information security risks + privacy risks in one register</text>
    <g transform="translate(420, 14)">
      <rect width="40" height="16" rx="8" fill="#dbeafe"/>
      <text x="20" y="11" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">SHARED</text>
    </g>
  </g>

  <g transform="translate(44, 356)">
    <!-- Policy framework -->
    <rect x="0" y="0" width="472" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="20" font-size="12" font-weight="700" fill="#0f172a">Policy framework</text>
    <text x="14" y="34" font-size="10" fill="#64748b">Security policies extended with privacy clauses — one source of truth</text>
    <g transform="translate(420, 14)">
      <rect width="40" height="16" rx="8" fill="#dbeafe"/>
      <text x="20" y="11" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">SHARED</text>
    </g>
  </g>

  <g transform="translate(44, 412)">
    <!-- Evidence pack -->
    <rect x="0" y="0" width="472" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="20" font-size="12" font-weight="700" fill="#0f172a">Evidence pack</text>
    <text x="14" y="34" font-size="10" fill="#64748b">SharePoint library mapped to both standards — one artefact, two controls</text>
    <g transform="translate(420, 14)">
      <rect width="40" height="16" rx="8" fill="#dbeafe"/>
      <text x="20" y="11" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">SHARED</text>
    </g>
  </g>

  <g transform="translate(44, 468)">
    <!-- Audit infrastructure -->
    <rect x="0" y="0" width="472" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="20" font-size="12" font-weight="700" fill="#0f172a">Audit infrastructure</text>
    <text x="14" y="34" font-size="10" fill="#64748b">Internal audit, management review, corrective action — one cadence</text>
    <g transform="translate(420, 14)">
      <rect width="40" height="16" rx="8" fill="#dbeafe"/>
      <text x="20" y="11" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">SHARED</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="44" y1="538" x2="516" y2="538" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bottom summary -->
  <g transform="translate(44, 562)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.5">RESULT</text>
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="148" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="74" y="18" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">~40%</text>
      <text x="74" y="34" text-anchor="middle" font-size="9" fill="#15803d" font-weight="600">Less work vs. sequential</text>

      <rect x="162" y="0" width="148" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="236" y="18" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">6–10 wks</text>
      <text x="236" y="34" text-anchor="middle" font-size="9" fill="#15803d" font-weight="600">To add PIMS to ISMS</text>

      <rect x="324" y="0" width="148" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="398" y="18" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">1</text>
      <text x="398" y="34" text-anchor="middle" font-size="9" fill="#15803d" font-weight="600">Audit cycle, two certs</text>
    </g>
  </g>
</svg>
