  <text x="16" y="352" font-size="10.5" fill="#1e293b" font-weight="700">ISM-1401</text>
  <text x="104" y="352" font-size="11" fill="#1e293b">Incident Response Plan</text>
  <rect x="348" y="339" width="76" height="18" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="386" y="352" font-size="9.5" fill="#475569" text-anchor="middle">Governance</text>
  <rect x="446" y="339" width="58" height="18" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="475" y="352" font-size="9.5" fill="#c2410c" text-anchor="middle">&#9651; Gap</text>
  <text x="572" y="352" font-size="10.5" fill="#374151">—</text>
  <rect x="748" y="339" width="58" height="18" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="777" y="352" font-size="9.5" fill="#c2410c" text-anchor="middle">Medium</text>
