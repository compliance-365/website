    <rect x="616" y="256" width="32" height="140" rx="3" fill="#0B0B0C" opacity="1"/><rect x="623.0" y="272" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="623.0" y="285" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="636.0" y="285" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="636.0" y="298" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="623.0" y="311" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="623.0" y="324" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="636.0" y="324" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/><rect x="636.0" y="337" width="5" height="5" rx="1" fill="#D8BA78" opacity=".55"/>
