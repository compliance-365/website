  <text x="104" y="100" font-size="11" font-weight="600" fill="#374151">Description</text>
  <text x="352" y="100" font-size="11" font-weight="600" fill="#374151">Domain</text>
  <text x="450" y="100" font-size="11" font-weight="600" fill="#374151">Status</text>
  <text x="572" y="100" font-size="11" font-weight="600" fill="#374151">Evidence Source</text>
  <text x="752" y="100" font-size="11" font-weight="600" fill="#374151">Priority</text>

  <!-- ROW 1: ISM-0974 MFA -->
  <rect y="110" width="880" height="36" fill="white"/>
  <line x1="0" y1="146" x2="880" y2="146" stroke="#f1f5f9"/>
  <text x="16" y="132" font-size="10.5" fill="#1e293b" font-weight="700">ISM-0974</text>
  <text x="104" y="132" font-size="11" fill="#1e293b">Multi-Factor Authentication</text>
  <rect x="348" y="119" width="62" height="18" rx="9" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="379" y="132" font-size="9.5" fill="#7c3aed" text-anchor="middle">Identity</text>
  <rect x="446" y="119" width="76" height="18" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="484" y="132" font-size="9.5" fill="#166534" text-anchor="middle">&#10003; Compliant</text>
  <text x="572" y="132" font-size="10.5" fill="#374151">Entra ID MFA + CA</text>
  <rect x="748" y="119" width="46" height="18" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="771" y="132" font-size="9.5" fill="#dc2626" text-anchor="middle">High</text>

