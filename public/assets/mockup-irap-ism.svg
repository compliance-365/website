  <rect x="446" y="155" width="86" height="18" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="489" y="168" font-size="9.5" fill="#1d4ed8" text-anchor="middle">&#8635; In Progress</text>
  <text x="572" y="168" font-size="10.5" fill="#374151">Intune + AppLocker</text>
  <rect x="748" y="155" width="46" height="18" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
