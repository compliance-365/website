<!-- public/assets/guide-automating.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Automating Compliance in Microsoft 365, Azure & AWS">
  <defs>
    <linearGradient id="ga-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" stop-opacity=".16"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="ga-chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F8FAFF"/>
    </linearGradient>
    <filter id="ga-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".14"/>
    </filter>
  </defs>

  <!-- Gradient frame -->
  <rect x="0" y="0" width="960" height="420" rx="18" fill="url(#ga-bg)"/>

  <!-- Canvas -->
  <g transform="translate(24,24)">
    <rect width="912" height="372" rx="16" fill="#fff" stroke="#e8ebf0"/>

    <!-- Center tile: Microsoft 365 -->
    <g transform="translate(356,70)" filter="url(#ga-soft)">
      <rect width="248" height="140" rx="14" fill="#fff" stroke="#e8ebf0"/>
      <rect x="20" y="28" width="120" height="18" rx="9" fill="#4F46E5" opacity=".12"/>
      <text x="20" y="26" font-family="system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif" font-size="14" fill="#111827" font-weight="700">
        Microsoft 365
      </text>
      <rect x="20" y="64" width="208" height="12" rx="6" fill="#cfd6ee" opacity=".8"/>
      <rect x="20" y="88" width="168" height="12" rx="6" fill="#e7ecfb"/>
    </g>

    <!-- Outgoing connectors -->
    <g stroke="#9AA6E3" stroke-width="2" fill="none" stroke-dasharray="6 6">
      <!-- to Azure -->
      <path d="M480 210 C 520 250, 600 250, 660 224"/>
      <!-- to AWS -->
      <path d="M480 210 C 440 250, 360 250, 300 224"/>
      <!-- to Evidence / Access / Posture badges -->
      <path d="M480 210 C 480 250, 480 260, 480 296"/>
    </g>

    <!-- Right: Azure block -->
    <g transform="translate(690,164)" filter="url(#ga-soft)">
      <rect width="190" height="120" rx="12" fill="#fff" stroke="#e8ebf0"/>
      <g transform="translate(14,12)">
        <rect width="60" height="24" rx="12" fill="#EEF2FF" stroke="#DFE5FF"/>
        <text x="12" y="16" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif" fill="#4F46E5" font-weight="700">Azure</text>
      </g>
      <g font-family="system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif" font-size="12" fill="#111827" opacity=".85">
        <rect x="16" y="50" width="158" height="12" rx="6" fill="#f2f5ff"/>
        <text x="20" y="59">Policy assignments → evidence</text>
        <rect x="16" y="74" width="138" height="12" rx="6" fill="#f8fafc"/>
        <text x="20" y="83">Key Vault configs → logs</text>
      </g>
    </g>

    <!-- Left: AWS block -->
    <g transform="translate(84,164)" filter="url(#ga-soft)">
      <rect width="190" height="120" rx="12" fill="#fff" stroke="#e8ebf0"/>
      <g transform="translate(14,12)">
        <rect width="56" height="24" rx="12" fill="#FFF7ED" stroke="#FED7AA"/>
        <text x="12" y="16" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif" fill="#9A3412" font-weight="700">AWS</text>
      </g>
      <g font-family="system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif" font-size="12" fill="#111827" opacity=".85">
        <rect x="16" y="50" width="158" height="12" rx="6" fill="#fff7ed"/>
        <text x="20" y="59">IAM Access Analyzer → CSV</text>
        <rect x="16" y="74" width="148" height="12" rx="6" fill="#fffaf5"/>
        <text x="20" y="83">Config snapshots → S3</text>
      </g>
    </g>

    <!-- Bottom badges: Evidence / Access / Posture -->
    <g transform="translate(360,300)">
      <g transform="translate(-92,0)">
        <rect width="150" height="34" rx="17" fill="url(#ga-chip)" stroke="#e8ebf0"/>
        <circle cx="17" cy="17" r="8" fill="#10B981"/>
        <path d="M13 17l3 3 5-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif" font-size="13" fill="#111827">Evidence</text>
      </g>
      <g transform="translate(74,0)">
        <rect width="160" height="34" rx="17" fill="url(#ga-chip)" stroke="#e8ebf0"/>
        <circle cx="17" cy="17" r="8" fill="#6366F1"/>
        <path d="M14 17h6M17 14v6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="32" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif" font-size="13" fill="#111827">Access Reviews</text>
      </g>
      <g transform="translate(248,0)">
        <rect width="150" height="34" rx="17" fill="url(#ga-chip)" stroke="#e8ebf0"/>
        <circle cx="17" cy="17" r="8" fill="#06B6D4"/>
        <path d="M12 17h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <text x="32" y="22" font-family="system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif" font-size="13" fill="#111827">Posture</text>
      </g>
    </g>

    <!-- Tiny caption -->
    <text x="24" y="26" font-family="system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif" font-size="13" fill="#4F46E5" font-weight="700">
      Automating Compliance
    </text>
  </g>
</svg>
