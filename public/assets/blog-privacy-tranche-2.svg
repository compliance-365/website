      <g transform="translate(0,22)"><rect width="410" height="76" rx="14" fill="#fff" stroke="#EDE6DA"/><rect x="18" y="18" width="40" height="40" rx="10" fill="#FBEFE8"/><text x="38" y="44" text-anchor="middle" fill="#A63A12">⚖</text><text x="76" y="34">Fair and reasonable test</text><text x="76" y="56" font-size="12" font-weight="600" fill="#6B6860">for all handling of personal information</text></g>
      <g transform="translate(0,112)"><rect width="410" height="76" rx="14" fill="#fff" stroke="#EDE6DA"/><rect x="18" y="18" width="40" height="40" rx="10" fill="#FBEFE8"/><text x="38" y="44" text-anchor="middle" fill="#A63A12">✓</text><text x="76" y="34">Tighter consent</text><text x="76" y="56" font-size="12" font-weight="600" fill="#6B6860">voluntary, informed, specific, current</text></g>
      <g transform="translate(0,202)"><rect width="410" height="76" rx="14" fill="#fff" stroke="#EDE6DA"/><rect x="18" y="18" width="40" height="40" rx="10" fill="#FBEFE8"/><text x="38" y="45" text-anchor="middle" font-size="13" fill="#A63A12">72h</text><text x="76" y="34">Breach statements</text><text x="76" y="56" font-size="12" font-weight="600" fill="#6B6860">proposed 72-hour timeframe</text></g>
