  <!-- Right: readiness pack -->
  <g transform="translate(500,60)" font-family="Inter, system-ui" font-size="13">
    <rect width="380" height="300" rx="14" fill="#fff" stroke="#e8ebf3"/>
    <text x="24" y="34" font-weight="700" fill="#0B0B0C" font-size="15">Readiness pack</text>

    <g transform="translate(24,54)">
      <rect width="332" height="70" rx="10" fill="#FBF0DD" stroke="#D8BA78"/>
      <circle cx="24" cy="24" r="9" fill="#A9812E"/>
      <text x="24" y="28" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">✓</text>
      <text x="42" y="28" fill="#0B0B0C" font-weight="700" font-size="12.5">Self-assessment answers, evidenced</text>
      <text x="14" y="52" fill="#8B6820" font-size="11.5">Pulled from live Entra, Intune &amp; Defender signals</text>
