  <rect x="446" y="263" width="86" height="18" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="489" y="276" font-size="9.5" fill="#1d4ed8" text-anchor="middle">&#8635; In Progress</text>
