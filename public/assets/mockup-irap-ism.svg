  <text x="370" y="312" font-size="9.5" fill="#0d9488" text-anchor="middle">Data</text>
  <rect x="446" y="299" width="76" height="18" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="484" y="312" font-size="9.5" fill="#166534" text-anchor="middle">&#10003; Compliant</text>
  <text x="572" y="312" font-size="10.5" fill="#374151">Microsoft Purview</text>
  <rect x="748" y="299" width="58" height="18" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="777" y="312" font-size="9.5" fill="#c2410c" text-anchor="middle">Medium</text>

  <!-- ROW 7: ISM-1401 Incident Response -->
