<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="bgRopa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="18" fill="url(#bgRopa)"/>

  <!-- White surface -->
  <g transform="translate(36,36)">
    <rect width="888" height="348" rx="16" fill="#fff" stroke="#e8ebf5"/>

    <!-- Header -->
    <text x="40" y="70" font-family="Inter, system-ui" font-weight="800" font-size="22" fill="#111827">
      Records of Processing Activities (ROPA)
    </text>
    <text x="40" y="98" font-family="Inter, system-ui" font-size="15" fill="#6B7280">
      Identify data, purpose, lawful basis and recipients.
    </text>

    <!-- Table headers -->
    <g font-family="Inter, system-ui" font-size="13" fill="#4F46E5" font-weight="700">
      <text x="40"  y="140">Data Category</text>
      <text x="260" y="140">Purpose</text>
      <text x="480" y="140">Retention</text>
      <text x="660" y="140">Owner</text>
    </g>

    <!-- Rows -->
    <g fill="#F9FAFB" stroke="#E5E7EB">
      <rect x="36" y="155" width="816" height="38" rx="6"/>
      <rect x="36" y="199" width="816" height="38" rx="6"/>
      <rect x="36" y="243" width="816" height="38" rx="6"/>
    </g>

    <!-- Row text -->
    <g font-family="Inter, system-ui" font-size="13" fill="#374151">
      <text x="48" y="179">Patient contact details</text>
      <text x="260" y="179">Appointment management</text>
      <text x="480" y="179">7 years</text>
      <text x="660" y="179">Privacy Officer</text>

      <text x="48" y="223">Staff HR records</text>
      <text x="260" y="223">Payroll & compliance</text>
      <text x="480" y="223">7 years</text>
      <text x="660" y="223">HR Manager</text>

      <text x="48" y="267">Customer contracts</text>
      <text x="260" y="267">Service delivery</text>
      <text x="480" y="267">10 years</text>
      <text x="660" y="267">Legal Team</text>
    </g>

    <!-- Checklist icon -->
    <g transform="translate(830,80)" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#EEF2FF" stroke="#DDE3FE"/>
      <path d="M-6 0l4 4l8 -8"/>
    </g>
  </g>

  <text x="60" y="386" font-family="Inter, system-ui" font-size="18" fill="#4F46E5" font-weight="700">
    What a Good ROPA Looks Like
  </text>
</svg>
