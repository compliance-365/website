<!-- Cover: ISO 27001 and Essential Eight — the same controls wearing two name tags -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Manrope, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BE4A1E" stop-opacity=".12"/><stop offset="1" stop-color="#F0A97F" stop-opacity=".10"/></linearGradient></defs><rect width="960" height="420" rx="20" fill="url(#bg)"/>
  <!-- name tags -->
  <g transform="translate(60,70) rotate(-4)">
    <rect width="250" height="130" rx="14" fill="#BE4A1E"/>
    <text x="125" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#FAF7F1" letter-spacing="3">HELLO, MY NAME IS</text>
    <rect x="16" y="54" width="218" height="60" rx="8" fill="#fff"/>
    <text x="125" y="93" text-anchor="middle" font-size="24" font-weight="800" fill="#0B0B0C">ISO 27001</text>
  </g>
  <g transform="translate(60,240) rotate(3)">
    <rect width="250" height="130" rx="14" fill="#0B0B0C"/>
    <text x="125" y="38" text-anchor="middle" font-size="13" font-weight="800" fill="#F0A97F" letter-spacing="3">HELLO, MY NAME IS</text>
    <rect x="16" y="54" width="218" height="60" rx="8" fill="#fff"/>
    <text x="125" y="93" text-anchor="middle" font-size="22" font-weight="800" fill="#0B0B0C">Essential Eight</text>
  </g>
  <g stroke="#BE4A1E" stroke-width="3" fill="none" stroke-dasharray="2 8" stroke-linecap="round">
    <path d="M320 140 C 380 140, 380 200, 430 200"/>
    <path d="M320 300 C 380 300, 380 230, 430 230"/>
  </g>
  <!-- shared controls -->
  <g transform="translate(440,56)">
    <rect width="460" height="310" rx="16" fill="#fff" stroke="#EDE6DA"/>
    <text x="24" y="38" font-size="13" font-weight="800" fill="#A63A12" letter-spacing="2">ONE SET OF CONTROLS</text>
    <g font-size="14" font-weight="700" fill="#0B0B0C">
      <g transform="translate(24,56)"><rect width="412" height="40" rx="10" fill="#FAF7F1"/><text x="14" y="25">Multi-factor authentication</text><text x="350" y="25" font-size="11" fill="#6B6860">A.8.5</text></g>
      <g transform="translate(24,102)"><rect width="412" height="40" rx="10" fill="#FAF7F1"/><text x="14" y="25">Patch applications &amp; OS</text><text x="350" y="25" font-size="11" fill="#6B6860">A.8.8</text></g>
      <g transform="translate(24,148)"><rect width="412" height="40" rx="10" fill="#FAF7F1"/><text x="14" y="25">Restrict admin privileges</text><text x="350" y="25" font-size="11" fill="#6B6860">A.8.2</text></g>
      <g transform="translate(24,194)"><rect width="412" height="40" rx="10" fill="#FAF7F1"/><text x="14" y="25">Application control</text><text x="350" y="25" font-size="11" fill="#6B6860">A.8.19</text></g>
      <g transform="translate(24,240)"><rect width="412" height="40" rx="10" fill="#FAF7F1"/><text x="14" y="25">Regular backups</text><text x="350" y="25" font-size="11" fill="#6B6860">A.8.13</text></g>
    </g>
  </g>
</svg>
