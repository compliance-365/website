name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Remove cache: npm to avoid lockfile requirement
          # cache: npm

      - name: Install deps (ci if lockfile, else i)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: Build
        run: npm run build

      - name: Debug build output
        run: |
          echo "=== dist root ==="
          ls -la dist || true
          echo "=== find sitemap ==="
          find dist -maxdepth 2 -type f -iname "sitemap*.xml" -print || true

      - name: Assert sitemap exists (Astro default)
        run: |
          if [ -f dist/sitemap-index.xml ]; then
            echo "Found sitemap-index.xml ✅"
          elif [ -f dist/sitemap.xml ]; then
            echo "Found sitemap.xml ✅"
          else
            echo "ERROR: No sitemap file produced (expected sitemap-index.xml)"; exit 1;
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
