  <text x="369" y="72" font-size="10.5" fill="#374151" text-anchor="middle">ISO 42001 (AIMS)</text>
  <text x="438" y="72" font-size="10.5" fill="#1e40af">&gt;&gt;</text>
  <text x="462" y="72" font-size="10.5" fill="#1e40af">+ Add view</text>

