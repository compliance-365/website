  <text x="16" y="285" font-size="10" fill="#64748b">ISMS — Clause 9.1</text>
  <text x="110" y="272" font-size="11" fill="#1e293b">Access Control Policy</text>
  <rect x="376" y="261" width="80" height="20" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
