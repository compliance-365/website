<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="title desc">
  <title id="title">ISO 27001 — ISMS Insights</title>
  <desc id="desc">Card-style graphic showing ISO 27001 ISMS risk trend with pills for ISO 27001, ISMS and Governance.</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F5F0E8"/>

  <!-- Compliance365 logo -->
  <g transform="translate(80,80)">
    <!-- Tick circle -->
    <circle cx="22" cy="20" r="18" fill="#A9812E"/>
    <path d="M15 20l5 5 8-10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Brand text -->
    <text x="50" y="24"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="26" font-weight="700" fill="#0B0B0C">
      Compliance365
    </text>
  </g>

  <!-- Main card -->
  <g transform="translate(80,140)">
    <rect width="1040" height="360" rx="28" ry="28" fill="#FFFFFF" stroke="rgba(15,23,42,0.04)"/>

    <!-- Card title -->
    <text x="40" y="70"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="40" font-weight="700" fill="#0B0B0C">
      ISO 27001 — ISMS Insights
    </text>

    <!-- Divider line -->
    <line x1="40" y1="90" x2="1000" y2="90" stroke="#F5F0E8" stroke-width="3" stroke-linecap="round"/>

    <!-- Risk trend label -->
    <text x="40" y="150"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="28" font-weight="700" fill="#0B0B0C">
      Risk trend
    </text>
    <text x="40" y="182"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="400" fill="#6B6860">
      Lower is better
    </text>

    <!-- Bars -->
    <!-- Highest risk (past) -->
    <rect x="320" y="130" width="320" height="32" rx="16" fill="#8B6820"/>
    <!-- Reduced risk -->
    <rect x="320" y="180" width="250" height="32" rx="16" fill="#D8BA78"/>
    <!-- Current (further reduced) -->
    <rect x="320" y="230" width="180" height="32" rx="16" fill="#D8BA78"/>

    <!-- Arrow baseline -->
    <line x1="320" y1="285" x2="660" y2="285" stroke="#0B0B0C" stroke-width="3" stroke-linecap="round"/>
    <path d="M660 275l14 10-14 10" fill="#0B0B0C"/>

  </g>

  <!-- Pills -->
  <g transform="translate(80,520)"
     font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="24" font-weight="600" fill="#FFFFFF">

    <!-- ISO 27001 pill -->
    <g>
      <rect x="0" y="0" width="190" height="56" rx="28" ry="28" fill="#A9812E"/>
      <text x="30" y="36">ISO 27001</text>
    </g>

    <!-- ISMS pill -->
    <g>
      <rect x="220" y="0" width="150" height="56" rx="28" ry="28" fill="#8B6820"/>
      <text x="252" y="36">ISMS</text>
    </g>

    <!-- Governance pill -->
    <g>
      <rect x="400" y="0" width="210" height="56" rx="28" ry="28" fill="#A9812E"/>
      <text x="428" y="36">Governance</text>
    </g>
  </g>
</svg>
