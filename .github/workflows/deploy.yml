name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: npm  # enable after you commit package-lock.json

      - name: Install deps (ci if lockfile, else i)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: Show package scripts & Astro version
        run: |
          node -v
          npm -v
          node -e "try{console.log(require('./package.json').scripts)}catch(e){console.error('No package.json?')}"
          npx astro --version || true

      # Ensures we actually run Astro (even if 'npm run build' points elsewhere)
      - name: Build (force Astro)
        run: npx astro build --verbose

      - name: List installed sitemap integration
        run: |
          npm ls @astrojs/sitemap || true
          grep -R "@astrojs/sitemap" -n astro.config.* || true

      - name: Debug build output
        run: |
          echo "=== dist root ==="
          ls -la dist || true
          echo "=== find any sitemap files ==="
          find dist -maxdepth 2 -type f -iname "sitemap*.xml" -print || true

      - name: Assert sitemap exists (any valid output)
        run: |
          if compgen -G "dist/sitemap-index.xml" > /dev/null || \
             compgen -G "dist/sitemap-*.xml" > /dev/null || \
             [ -f dist/sitemap.xml ]; then
            echo "Sitemap found ✅"
          else
            echo "ERROR: No sitemap files produced (expected sitemap-index.xml / sitemap-0.xml)."
            echo "Tip: ensure @astrojs/sitemap is installed and 'site' is set in astro.config."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
