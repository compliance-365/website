<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="bg42001" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="18" fill="url(#bg42001)"/>

  <g transform="translate(36,36)">
    <rect width="888" height="348" rx="16" fill="#fff" stroke="#e8ebf5"/>

    <!-- Header -->
    <text x="40" y="70" font-family="Inter, system-ui" font-weight="800" font-size="22" fill="#111827">
      AI Governance Framework
    </text>
    <text x="40" y="98" font-family="Inter, system-ui" font-size="15" fill="#6B7280">
      Model inventory, risk, human oversight and monitoring.
    </text>

    <!-- Donut chart -->
    <g transform="translate(200,200)">
      <circle r="80" fill="#F9FAFB" stroke="#E5E7EB"/>
      <circle r="80" fill="none" stroke="#A5B4FC" stroke-width="20" stroke-dasharray="250 250" transform="rotate(-90)"/>
      <circle r="80" fill="none" stroke="#67E8F9" stroke-width="20" stroke-dasharray="160 340" transform="rotate(45)"/>
      <circle r="12" fill="#4F46E5"/>
      <text text-anchor="middle" y="6" font-family="Inter" font-size="14" fill="#4B5563">Models</text>
    </g>

    <!-- Right panels -->
    <g transform="translate(400,110)">
      <rect width="420" height="60" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
      <rect y="80" width="420" height="60" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
      <rect y="160" width="420" height="60" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
      <text x="24" y="38" font-family="Inter" font-size="14" fill="#374151">AI Risk Assessment</text>
      <text x="24" y="118" font-family="Inter" font-size="14" fill="#374151">Bias & Fairness Review</text>
      <text x="24" y="198" font-family="Inter" font-size="14" fill="#374151">Human Oversight</text>
      <!-- status tags -->
      <g font-family="Inter" font-size="12" font-weight="700" text-anchor="middle">
        <rect x="340" y="18" width="70" height="24" rx="12" fill="#EEF2FF" stroke="#DDE3FE"/>
        <text x="375" y="34" fill="#4F46E5">Ready</text>
        <rect x="340" y="98" width="70" height="24" rx="12" fill="#ECFDF5" stroke="#D1FAE5"/>
        <text x="375" y="114" fill="#059669">Active</text>
        <rect x="340" y="178" width="70" height="24" rx="12" fill="#FFF7ED" stroke="#FED7AA"/>
        <text x="375" y="194" fill="#B45309">Pending</text>
      </g>
    </g>
  </g>

  <text x="60" y="386" font-family="Inter, system-ui" font-size="18" fill="#4F46E5" font-weight="700">
    AI Governance Readiness (ISO 42001)
  </text>
</svg>
