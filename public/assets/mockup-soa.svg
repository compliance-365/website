  <text x="16" y="361" font-size="11" font-weight="700" fill="#1e293b">A.16.1</text>
  <text x="16" y="377" font-size="10" fill="#64748b">ISMS — Clause 16.1</text>
  <text x="110" y="364" font-size="11" fill="#1e293b">Management of Information Security Incidents</text>
