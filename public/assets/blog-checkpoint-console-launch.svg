<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="gcp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity=".08"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="20" fill="url(#gcp)"/>

  <!-- Left: your Microsoft 365 tenant -->
  <g transform="translate(80,60)" font-family="Inter, system-ui" font-size="13">
    <rect width="380" height="300" rx="14" fill="#fff" stroke="#e8ebf3"/>
    <text x="24" y="34" font-weight="700" fill="#0B0B0C" font-size="15">Your Microsoft 365 tenant</text>
    <rect x="24" y="48" width="180" height="10" rx="5" fill="#F5F0E8"/>

    <g font-family="Inter, system-ui" font-size="12.5">
      <g transform="translate(24,76)">
        <rect x="-4" y="-4" width="332" height="38" rx="9" fill="#F5F0E8"/>
        <circle cx="14" cy="15" r="9" fill="#10B981"/>
        <path d="M10 15l3 3 6-6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="19" fill="#0B0B0C" font-weight="600">Risk &amp; actions register</text>
      </g>
      <g transform="translate(24,122)">
        <rect x="-4" y="-4" width="332" height="38" rx="9" fill="#F5F0E8"/>
        <circle cx="14" cy="15" r="9" fill="#10B981"/>
        <path d="M10 15l3 3 6-6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="19" fill="#0B0B0C" font-weight="600">Statement of Applicability</text>
      </g>
      <g transform="translate(24,168)">
        <rect x="-4" y="-4" width="332" height="38" rx="9" fill="#F5F0E8"/>
        <circle cx="14" cy="15" r="9" fill="#10B981"/>
        <path d="M10 15l3 3 6-6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="19" fill="#0B0B0C" font-weight="600">Vendor risk register</text>
      </g>
      <g transform="translate(24,214)">
        <rect x="-4" y="-4" width="332" height="38" rx="9" fill="#F5F0E8"/>
        <circle cx="14" cy="15" r="9" fill="#10B981"/>
        <path d="M10 15l3 3 6-6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="34" y="19" fill="#0B0B0C" font-weight="600">Audit log</text>
      </g>
    </g>
    <text x="24" y="284" fill="#6B6860" font-size="11.5">Every register — a SharePoint list you already own</text>
  </g>

  <!-- Right: no backend -->
  <g transform="translate(500,60)" font-family="Inter, system-ui" font-size="13">
    <rect width="380" height="300" rx="14" fill="#fff" stroke="#e8ebf3"/>
    <text x="24" y="34" font-weight="700" fill="#0B0B0C" font-size="15">No backend</text>

    <!-- crossed out: third-party platform -->
    <g transform="translate(24,54)" opacity="0.5">
      <rect width="332" height="54" rx="10" fill="#F5F0E8"/>
      <text x="14" y="24" fill="#6B6860" font-weight="600" font-size="12">Third-party GRC platform</text>
      <text x="14" y="42" fill="#6B6860" font-size="11">Your data, copied to someone else's database</text>
      <line x1="10" y1="27" x2="322" y2="27" stroke="#6B6860" stroke-width="1.4"/>
    </g>

    <!-- highlighted: reads graph directly -->
    <g transform="translate(24,124)">
      <rect width="332" height="70" rx="10" fill="#FBF0DD" stroke="#D8BA78"/>
      <circle cx="24" cy="24" r="9" fill="#A9812E"/>
      <text x="24" y="28" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">✓</text>
      <text x="42" y="28" fill="#0B0B0C" font-weight="700" font-size="12.5">Reads Microsoft Graph directly</text>
      <text x="14" y="52" fill="#8B6820" font-size="11.5">Live Entra, Intune &amp; Defender signals</text>
    </g>

    <g transform="translate(24,214)">
      <rect width="332" height="70" rx="10" fill="#FBF0DD" stroke="#D8BA78"/>
      <circle cx="24" cy="24" r="9" fill="#A9812E"/>
      <text x="24" y="28" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">✓</text>
      <text x="42" y="28" fill="#0B0B0C" font-weight="700" font-size="12.5">Nothing to breach, nothing to migrate</text>
      <text x="14" y="52" fill="#8B6820" font-size="11.5">No server, no database — ever</text>
    </g>
  </g>

  <text x="50%" y="392" font-family="Inter, system-ui" font-size="22" text-anchor="middle" fill="#0B0B0C" font-weight="700">
    Checkpoint — the compliance console that never leaves your tenant
  </text>
</svg>
