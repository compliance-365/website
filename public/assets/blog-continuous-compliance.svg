<!-- Cover: continuous compliance inside Microsoft 365 — scan, drift alert, chase, evidence -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Manrope, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BE4A1E" stop-opacity=".12"/><stop offset="1" stop-color="#F0A97F" stop-opacity=".10"/></linearGradient></defs><rect width="960" height="420" rx="20" fill="url(#bg)"/>
  <text x="60" y="66" font-size="13" font-weight="800" fill="#A63A12" letter-spacing="2">CONTINUOUS COMPLIANCE · INSIDE YOUR TENANT</text>
  <!-- weekly track -->
  <g transform="translate(60,96)">
    <rect width="840" height="250" rx="16" fill="#fff" stroke="#EDE6DA"/>
    <g font-size="11" font-weight="700" fill="#6B6860">
      <text x="40" y="34">MON</text><text x="160" y="34">TUE</text><text x="280" y="34">WED</text><text x="400" y="34">THU</text><text x="520" y="34">FRI</text><text x="640" y="34">MON</text><text x="760" y="34">TUE</text>
    </g>
    <line x1="30" y1="126" x2="810" y2="126" stroke="#EDE6DA" stroke-width="4" stroke-linecap="round"/>
    <!-- scans -->
    <g fill="#BE4A1E"><circle cx="54" cy="126" r="9"/><circle cx="294" cy="126" r="9"/><circle cx="534" cy="126" r="9"/><circle cx="774" cy="126" r="9"/></g>
    <g font-size="11" fill="#4A4740" text-anchor="middle"><text x="54" y="156">scan</text><text x="294" y="156">scan</text><text x="534" y="156">scan</text><text x="774" y="156">scan</text></g>
    <!-- drift alert -->
    <g transform="translate(300,56)"><rect width="190" height="44" rx="10" fill="#FEF3C7" stroke="#F59E0B"/><text x="14" y="20" font-size="11" font-weight="800" fill="#92400E">DRIFT ALERT</text><text x="14" y="35" font-size="12" font-weight="700" fill="#0B0B0C">MFA excluded for 2 users</text></g>
    <path d="M300 100 L294 116" stroke="#F59E0B" stroke-width="2"/>
    <!-- chase -->
    <g transform="translate(360,176)"><rect width="200" height="50" rx="10" fill="#FAF7F1" stroke="#EDE6DA"/><circle cx="24" cy="25" r="12" fill="#FBEFE8"/><text x="24" y="30" text-anchor="middle" font-size="12" font-weight="800" fill="#A63A12">KP</text><text x="46" y="21" font-size="11" font-weight="800" fill="#0B0B0C">Owner chased in Teams</text><text x="46" y="37" font-size="11" fill="#6B6860">due Friday</text></g>
    <!-- resolved -->
    <g transform="translate(600,176)"><rect width="200" height="50" rx="10" fill="#ecfdf5" stroke="#A7F3D0"/><circle cx="24" cy="25" r="10" fill="#10B981"/><path d="M19 25l4 4 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="21" font-size="11" font-weight="800" fill="#047857">Fixed &amp; re-checked</text><text x="46" y="37" font-size="11" fill="#065F46">evidence saved automatically</text></g>
  </g>
  <text x="60" y="380" font-size="13" fill="#4A4740">Scheduled scans · drift alerts · automated chasing · evidence that dates itself</text>
</svg>
