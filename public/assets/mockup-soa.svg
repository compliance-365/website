  <text x="380" y="100" font-size="11" font-weight="600" fill="#374151">Applicable</text>
  <text x="480" y="100" font-size="11" font-weight="600" fill="#374151">Implemented</text>
  <text x="640" y="100" font-size="11" font-weight="600" fill="#374151">Justification</text>

