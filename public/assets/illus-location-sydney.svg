  <!-- framework card -->
  <g font-family="Inter, system-ui, Segoe UI, Roboto, sans-serif">
    <rect x="40" y="36" width="416" height="112" rx="16" fill="#ffffff" stroke="#F5F0E8"/>
    <text x="64" y="70" font-size="19" font-weight="800" fill="#0B0B0C">Sydney</text>
    <text x="64" y="92" font-size="12.5" fill="#6B6860">Most requested in New South Wales</text>
    <g transform="translate(64,106)"><g transform="translate(0.0,0)">
        <rect width="75.4" height="26" rx="13" fill="#A9812E" opacity=".12"/>
        <text x="37.7" y="17" text-anchor="middle" font-size="11.5" font-weight="700" fill="#A9812E">ISO 27001</text>
      </g><g transform="translate(83.4,0)">
        <rect width="101.8" height="26" rx="13" fill="#A9812E" opacity=".12"/>
        <text x="50.9" y="17" text-anchor="middle" font-size="11.5" font-weight="700" fill="#A9812E">SOC 2 Type II</text>
      </g><g transform="translate(193.2,0)">
