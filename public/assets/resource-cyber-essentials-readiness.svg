    <g transform="translate(24,144)">
      <rect width="332" height="70" rx="10" fill="#F5F0E8"/>
      <text x="14" y="26" fill="#0B0B0C" font-weight="700" font-size="12">Your choice of licensed body</text>
      <text x="14" y="44" fill="#6B6860" font-size="11">We prepare it — submission goes through an</text>
      <text x="14" y="59" fill="#6B6860" font-size="11">IASME-licensed Certification Body you choose</text>
    </g>

    <g transform="translate(24,234)">
      <rect width="332" height="46" rx="10" fill="#F5F0E8"/>
      <text x="14" y="20" fill="#0B0B0C" font-weight="700" font-size="12">Basic or Plus</text>
      <text x="14" y="37" fill="#6B6860" font-size="11">Self-assessed, or externally verified</text>
    </g>
  </g>

  <text x="50%" y="392" font-family="Inter, system-ui" font-size="22" text-anchor="middle" fill="#0B0B0C" font-weight="700">
