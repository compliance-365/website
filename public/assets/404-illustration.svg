<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="t404 d404">
  <title id="t404">Page not found</title>
  <desc id="d404">A document with a broken link marker beside a large 404, in the Compliance365 gold and ink palette.</desc>
  <defs>
    <linearGradient id="g404" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity=".14"/>
    </linearGradient>
  </defs>

  <rect width="520" height="340" rx="20" fill="url(#g404)"/>

  <!-- document -->
  <g transform="translate(58,64)">
    <rect x="0" y="0" width="150" height="196" rx="12" fill="#fff" stroke="#DDD8CF" stroke-width="2"/>
    <rect x="24" y="30" width="86" height="11" rx="5.5" fill="#A9812E"/>
    <rect x="24" y="58" width="102" height="8" rx="4" fill="#F0EBE1"/>
    <rect x="24" y="78" width="76" height="8" rx="4" fill="#F0EBE1"/>
    <rect x="24" y="98" width="94" height="8" rx="4" fill="#F0EBE1"/>
    <rect x="24" y="118" width="60" height="8" rx="4" fill="#F0EBE1"/>
    <rect x="24" y="146" width="102" height="8" rx="4" fill="#F0EBE1"/>
    <rect x="24" y="166" width="70" height="8" rx="4" fill="#F0EBE1"/>
  </g>

  <!-- broken link, sitting over the document edge -->
  <g transform="translate(178,152)">
    <circle r="34" fill="#0B0B0C"/>
    <g stroke="#D8BA78" stroke-width="4.5" stroke-linecap="round" fill="none">
      <path d="M-15 4 a10 10 0 0 1 0-14 l6-6 a10 10 0 0 1 14 0"/>
      <path d="M15 -4 a10 10 0 0 1 0 14 l-6 6 a10 10 0 0 1-14 0"/>
    </g>
    <path d="M-3 -16 L3 -22 M8 -3 L15 -6 M-15 6 L-8 3" stroke="#A9812E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 404 -->
  <text x="330" y="196"
        font-family="Fraunces, Georgia, serif" font-size="104" font-weight="500"
        fill="#0B0B0C" text-anchor="middle" letter-spacing="-2">404</text>
  <rect x="268" y="218" width="124" height="4" rx="2" fill="#A9812E"/>
  <text x="330" y="252"
        font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="700"
        fill="#6B6860" text-anchor="middle" letter-spacing="2.4">NOT FOUND</text>
</svg>
