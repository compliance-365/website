  <rect x="636" y="215" width="82" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="677" y="229" font-size="10" fill="#1d4ed8" text-anchor="middle">ISO Required</text>

