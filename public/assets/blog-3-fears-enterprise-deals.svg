<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" height="800" width="1200">
  
  <defs>
    <linearGradient y2="100%" x2="100%" y1="0%" x1="0%" id="bgGrad">
      <stop stop-color="#f0f7ff" offset="0%"></stop>
      <stop stop-color="#ffffff" offset="100%"></stop>
    </linearGradient>
    <filter height="140%" width="140%" y="-20%" x="-20%" id="shadow">
      <feGaussianBlur stdDeviation="8" in="SourceAlpha"></feGaussianBlur>
      <feOffset result="offsetblur" dy="6" dx="0"></feOffset>
      <feComponentTransfer>
        <feFuncA slope="0.25" type="linear"></feFuncA>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  
  <rect fill="url(#bgGrad)" height="800" width="1200"></rect>

  
  <text fill="#1e40af" font-weight="900" font-size="52" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="120" x="600">
    3 Biggest Fears Killing
  </text>
  <text fill="#1e40af" font-weight="900" font-size="52" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="190" x="600">
    Enterprise Deals
  </text>
  <text fill="#1e3a8a" font-weight="600" font-size="32" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="260" x="600">
    (and How to Fix Them Fast)
  </text>

  
  <text fill="#64748b" font-size="22" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="340" x="600">
    Enterprise Compliance Challenges for SaaS and Tech Companies in Australia
  </text>

  
  
  <g filter="url(#shadow)">
    <rect stroke-width="2" stroke="#e2e8f0" fill="white" rx="20" height="340" width="340" y="400" x="100"></rect>
    <circle opacity="0.1" fill="#1e40af" r="50" cy="460" cx="270"></circle>
    <text fill="#1e40af" font-size="48" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="470" x="270">⏳</text>
    <text fill="#1e3a8a" font-weight="800" font-size="24" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="540" x="270">
      Long, Unpredictable
    </text>
    <text fill="#1e3a8a" font-weight="800" font-size="24" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="570" x="270">
      Timelines
    </text>
    <text style="line-height:1.5;" fill="#64748b" font-size="16" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="620" x="270">
      Traditional projects take 6–18 months,
    </text>
    <text fill="#64748b" font-size="16" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="640" x="270">
      stalling deals and burning budget.
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect stroke-width="2" stroke="#e2e8f0" fill="white" rx="20" height="340" width="340" y="400" x="480"></rect>
    <circle opacity="0.1" fill="#1e40af" r="50" cy="460" cx="650"></circle>
    <text fill="#1e40af" font-size="48" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="470" x="650">🔧</text>
    <text fill="#1e3a8a" font-weight="800" font-size="24" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="540" x="650">
      Heavy Engineering
    </text>
    <text fill="#1e3a8a" font-weight="800" font-size="24" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="570" x="650">
      Disruption
    </text>
    <text style="line-height:1.5;" fill="#64748b" font-size="16" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="620" x="650">
      New tools and forced changes
    </text>
    <text fill="#64748b" font-size="16" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="640" x="650">
      pull teams away from product.
    </text>
  </g>

  
  <g filter="url(#shadow)">
    <rect stroke-width="2" stroke="#e2e8f0" fill="white" rx="20" height="340" width="340" y="400" x="860"></rect>
    <circle opacity="0.1" fill="#1e40af" r="50" cy="460" cx="1030"></circle>
    <text fill="#1e40af" font-size="48" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="470" x="1030">⚠️</text>
    <text fill="#1e3a8a" font-weight="800" font-size="24" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="540" x="1030">
      Lack of Credible
    </text>
    <text fill="#1e3a8a" font-weight="800" font-size="24" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="570" x="1030">
      Proof
    </text>
    <text style="line-height:1.5;" fill="#64748b" font-size="16" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="620" x="1030">
      Procurement &amp; auditors demand
    </text>
    <text fill="#64748b" font-size="16" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="640" x="1030">
      defensible evidence — not just words.
    </text>
  </g>

  
  <text fill="#64748b" font-weight="600" font-size="20" font-family="Nunito, system-ui, sans-serif" text-anchor="middle" y="760" x="600">
    Enterprise Compliance Challenges for SaaS and Tech Companies in Australia
  </text>
</svg>
