    <g transform="translate(150,200) rotate(-14)"><rect x="-110" y="-30" width="220" height="60" rx="8" fill="none" stroke="#BE4A1E" stroke-width="5"/><text x="0" y="10" text-anchor="middle" font-size="22" font-weight="900" fill="#BE4A1E" letter-spacing="2">EXPOSURE DRAFT</text></g>
