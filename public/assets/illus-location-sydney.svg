<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-sydney d-sydney">
  <title id="t-sydney">Compliance365 in Sydney</title>
  <desc id="d-sydney">A stylised Sydney skyline beneath a card listing the compliance frameworks most requested by New South Wales organisations: ISO 27001, SOC 2 Type II, ISO 42001.</desc>
  <defs>
    <linearGradient id="bg-sydney" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".16"/>
