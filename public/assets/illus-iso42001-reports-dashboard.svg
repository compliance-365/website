<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">AIMS reporting dashboard illustration</title>
  <desc id="desc">An AI management system dashboard with an AI risk trend chart, Annex A control coverage by category, an audit-readiness score, and an evidenced-controls checklist.</desc>

  <defs>
    <linearGradient id="grad-bg-42" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity=".14"/>
    </linearGradient>
    <filter id="softShadow42" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(10,18,32,.25)"/>
    </filter>
    <linearGradient id="grad-line-42" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9812E"/>
      <stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" rx="28" fill="url(#grad-bg-42)"/>

  <g filter="url(#softShadow42)">
    <rect x="40" y="40" width="880" height="480" rx="18" fill="#fff" stroke="#F5F0E8"/>
    <rect x="40" y="40" width="880" height="64" rx="18" fill="#fff"/>
    <text x="72" y="80" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="18" fill="#0B0B0C">
      AI Management System — Reporting
    </text>
    <circle cx="860" cy="72" r="6" fill="#F5F0E8"/>
    <circle cx="880" cy="72" r="6" fill="#F5F0E8"/>
    <circle cx="900" cy="72" r="6" fill="#F5F0E8"/>

    <!-- left nav -->
    <g>
      <rect x="40" y="104" width="180" height="416" rx="14" fill="#F5F0E8" stroke="#F5F0E8"/>
      <text x="60" y="140" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="13" fill="#6B6860">Navigation</text>
      <g font-family="Nunito, Arial, sans-serif" font-size="13">
        <text x="68" y="176" fill="#6B6860">AI Systems</text>
        <text x="68" y="208" fill="#6B6860">Risk &amp; Impact</text>
        <text x="68" y="240" fill="#6B6860">Annex A / SoA</text>
        <text x="68" y="272" fill="#6B6860">Policies</text>
        <rect x="52" y="288" width="148" height="32" rx="8" fill="#A9812E" opacity=".08"/>
        <text x="68" y="308" fill="#0B0B0C" font-weight="800">Reports</text>
        <text x="68" y="340" fill="#6B6860">Audit Log</text>
      </g>
    </g>

    <!-- content -->
    <g transform="translate(236,116)">

      <!-- line chart: AI risk assessments -->
      <g>
        <rect x="0" y="0" width="460" height="190" rx="14" fill="#fff" stroke="#F5F0E8"/>
        <text x="18" y="28" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="14" fill="#0B0B0C">
          AI Risk Assessments Completed (last 12 weeks)
        </text>
        <line x1="40" y1="150" x2="420" y2="150" stroke="#F5F0E8"/>
        <line x1="40" y1="60"  x2="420" y2="60"  stroke="#F5F0E8"/>
        <line x1="40" y1="105" x2="420" y2="105" stroke="#F5F0E8"/>
        <g font-family="Nunito, Arial, sans-serif" font-size="11" fill="#6B6860">
          <text x="44"  y="170">W1</text><text x="84"  y="170">W2</text><text x="124" y="170">W3</text>
          <text x="164" y="170">W4</text><text x="204" y="170">W5</text><text x="244" y="170">W6</text>
          <text x="284" y="170">W7</text><text x="324" y="170">W8</text><text x="364" y="170">W9</text>
          <text x="404" y="170">W10</text>
        </g>
        <path d="M40,144
                 C60,132 80,136 100,122
                 S140,100 160,112
                 S200,118 220,90
                 S260,74 280,86
                 S320,92 340,68
                 S380,58 400,72"
              fill="none" stroke="url(#grad-line-42)" stroke-width="3"/>
        <g fill="#A9812E" opacity=".95">
          <circle cx="40"  cy="144" r="3.5"/>
          <circle cx="80"  cy="134" r="3.5"/>
          <circle cx="120" cy="118" r="3.5"/>
          <circle cx="160" cy="112" r="3.5"/>
          <circle cx="200" cy="120" r="3.5"/>
          <circle cx="240" cy="84"  r="3.5"/>
          <circle cx="280" cy="86"  r="3.5"/>
          <circle cx="320" cy="80"  r="3.5"/>
          <circle cx="360" cy="64"  r="3.5"/>
          <circle cx="400" cy="72"  r="3.5"/>
        </g>
        <rect x="300" y="16" width="10" height="10" rx="2" fill="url(#grad-line-42)"/>
        <text x="316" y="25" font-family="Nunito, Arial, sans-serif" font-size="12" fill="#6B6860">Assessments closed</text>
      </g>

      <!-- Annex A coverage by category -->
      <g transform="translate(0,206)">
        <rect x="0" y="0" width="460" height="190" rx="14" fill="#fff" stroke="#F5F0E8"/>
        <text x="18" y="28" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="14" fill="#0B0B0C">
          Annex A Coverage (by category)
        </text>

        <text x="18" y="64" font-family="Nunito, Arial, sans-serif" font-size="12" fill="#6B6860">Governance</text>
        <rect x="110" y="52" width="240" height="16" rx="8" fill="#A9812E"/>
        <rect x="350" y="52" width="40"  height="16" rx="8" fill="#DDD8CF"/>

        <text x="18" y="100" font-family="Nunito, Arial, sans-serif" font-size="12" fill="#6B6860">Data</text>
        <rect x="110" y="88" width="210" height="16" rx="8" fill="#A9812E"/>
        <rect x="320" y="88" width="70"  height="16" rx="8" fill="#DDD8CF"/>

        <text x="18" y="136" font-family="Nunito, Arial, sans-serif" font-size="12" fill="#6B6860">Life cycle</text>
        <rect x="110" y="124" width="260" height="16" rx="8" fill="#A9812E"/>
        <rect x="370" y="124" width="20"  height="16" rx="8" fill="#DDD8CF"/>

        <rect x="290" y="16" width="10" height="10" rx="2" fill="#A9812E"/>
        <text x="306" y="25" font-family="Nunito, Arial, sans-serif" font-size="12" fill="#6B6860">Evidenced</text>
        <rect x="386" y="16" width="10" height="10" rx="2" fill="#DDD8CF"/>
        <text x="402" y="25" font-family="Nunito, Arial, sans-serif" font-size="12" fill="#6B6860">Open</text>
      </g>

      <!-- right rail: score + checklist -->
      <g transform="translate(484,0)">
        <rect x="0" y="0" width="220" height="190" rx="14" fill="#fff" stroke="#F5F0E8"/>
        <text x="18" y="28" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="14" fill="#0B0B0C">
          Audit Readiness
        </text>
        <g transform="translate(110,108)">
          <circle r="64" fill="none" stroke="#F5F0E8" stroke-width="14"/>
          <path d="
            M 0 -64
            A 64 64 0 1 1  -58 -27
          " fill="none" stroke="url(#grad-line-42)" stroke-width="14" stroke-linecap="round"/>
          <text x="0" y="6" text-anchor="middle" font-family="Nunito, Arial" font-weight="900" font-size="22" fill="#0B0B0C">91%</text>
          <text x="0" y="28" text-anchor="middle" font-family="Nunito, Arial" font-size="12" fill="#6B6860">audit-ready</text>
        </g>

        <g transform="translate(0,206)">
          <rect x="0" y="0" width="220" height="190" rx="14" fill="#fff" stroke="#F5F0E8"/>
          <text x="18" y="28" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="14" fill="#0B0B0C">
            Evidenced This Cycle
          </text>
          <g font-family="Nunito, Arial, sans-serif" font-size="12" fill="#0B0B0C">
            <g transform="translate(18,48)">
              <circle cx="0" cy="0" r="9" fill="#A9812E"/>
              <path d="M-4 0 l3 3 6 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="16" y="4">AI system inventory current</text>
            </g>
            <g transform="translate(18,76)">
              <circle cx="0" cy="0" r="9" fill="#A9812E"/>
              <path d="M-4 0 l3 3 6 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="16" y="4">Human oversight documented</text>
            </g>
            <g transform="translate(18,104)">
              <circle cx="0" cy="0" r="9" fill="#A9812E"/>
              <path d="M-4 0 l3 3 6 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="16" y="4">Model monitoring active</text>
            </g>
            <g transform="translate(18,132)">
              <circle cx="0" cy="0" r="9" fill="#A9812E"/>
              <path d="M-4 0 l3 3 6 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="16" y="4">Third-party AI assessed</text>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
