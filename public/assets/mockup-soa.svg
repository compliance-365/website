  <rect y="294" width="880" height="46" fill="white"/>
  <line x1="0" y1="340" x2="880" y2="340" stroke="#f1f5f9"/>
  <text x="16" y="315" font-size="11" font-weight="700" fill="#1e293b">A.12.1</text>
  <text x="16" y="331" font-size="10" fill="#64748b">ISMS — Clause 12.1</text>
  <text x="110" y="318" font-size="11" fill="#1e293b">Operational Procedures and Responsibilities</text>
  <rect x="376" y="307" width="80" height="20" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="416" y="321" font-size="10" fill="#166534" text-anchor="middle">&#10003; Applicable</text>
  <rect x="476" y="307" width="130" height="20" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="541" y="321" font-size="10" fill="#c2410c" text-anchor="middle">&#9679; Partially Implemented</text>
  <rect x="636" y="307" width="82" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="677" y="321" font-size="10" fill="#1d4ed8" text-anchor="middle">ISO Required</text>

