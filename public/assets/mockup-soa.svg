<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 388" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <clipPath id="soa-clip"><rect width="880" height="388" rx="10"/></clipPath>
  </defs>

  <!-- Card -->
  <rect width="880" height="388" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect width="880" height="48" fill="#f8fafc" clip-path="url(#soa-clip)"/>
  <line x1="0" y1="48" x2="880" y2="48" stroke="#e2e8f0"/>
  <text x="18" y="30" font-size="15" font-weight="700" fill="#0f172a">Statement of Applicability (SOA)</text>
  <text x="726" y="30" font-size="11" fill="#64748b">⊟ Edit in grid view</text>
  <text x="836" y="30" font-size="11" fill="#64748b">⇑ Export</text>

  <!-- Framework tabs -->
  <rect y="48" width="880" height="34" fill="#f8fafc"/>
  <line x1="0" y1="82" x2="880" y2="82" stroke="#e2e8f0"/>
  <text x="14" y="72" font-size="10.5" fill="#64748b">All Items</text>
  <rect x="70" y="57" width="110" height="22" rx="4" fill="#1e40af"/>
  <text x="125" y="72" font-size="10.5" fill="white" text-anchor="middle" font-weight="600">ISO 27001 (ISMS)</text>
  <rect x="192" y="57" width="110" height="22" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="247" y="72" font-size="10.5" fill="#374151" text-anchor="middle">ISO 27701 (PIMS)</text>
