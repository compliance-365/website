  <rect x="748" y="227" width="46" height="18" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="771" y="240" font-size="9.5" fill="#dc2626" text-anchor="middle">High</text>

  <!-- ROW 5: ISM-1159 System Monitoring -->
  <rect y="254" width="880" height="36" fill="white"/>
  <line x1="0" y1="290" x2="880" y2="290" stroke="#f1f5f9"/>
  <text x="16" y="276" font-size="10.5" fill="#1e293b" font-weight="700">ISM-1159</text>
  <text x="104" y="276" font-size="11" fill="#1e293b">System Monitoring &amp; Logging</text>
