<!-- public/assets/illus-cps234.svg — CPS 234: two notification clocks over the nine audit domains -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Manrope, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BE4A1E" stop-opacity=".16"/><stop offset="1" stop-color="#0B0B0C" stop-opacity=".16"/></linearGradient></defs><rect width="720" height="470" rx="26" fill="url(#g)"/>
  <!-- Clock 1: 72 hours -->
  <g transform="translate(40,36)">
    <rect width="310" height="230" rx="16" fill="#fff"/>
    <text x="20" y="32" font-size="12" font-weight="700" fill="#A63A12" letter-spacing="1.5">¶35 · MATERIAL INCIDENT</text>
    <circle cx="90" cy="130" r="58" fill="none" stroke="#F5F0E8" stroke-width="14"/>
    <circle cx="90" cy="130" r="58" fill="none" stroke="#BE4A1E" stroke-width="14" stroke-dasharray="364.4" stroke-dashoffset="91" transform="rotate(-90 90 130)" stroke-linecap="round"/>
    <text x="90" y="136" text-anchor="middle" font-size="26" font-weight="800" fill="#0B0B0C">72h</text>
    <text x="172" y="112" font-size="13" font-weight="700" fill="#0B0B0C">Clock starts on</text>
    <text x="172" y="130" font-size="13" font-weight="700" fill="#0B0B0C">becoming aware</text>
    <rect x="172" y="146" width="112" height="9" rx="4.5" fill="#F5F0E8"/>
    <rect x="172" y="164" width="86" height="9" rx="4.5" fill="#F5F0E8"/>
    <text x="20" y="214" font-size="12" fill="#6B6860">Incident occurred, or notified to another regulator</text>
  </g>
  <!-- Clock 2: 10 business days -->
  <g transform="translate(370,36)">
    <rect width="310" height="230" rx="16" fill="#fff"/>
    <text x="20" y="32" font-size="12" font-weight="700" fill="#A63A12" letter-spacing="1.5">¶36 · CONTROL WEAKNESS</text>
    <g transform="translate(20,62)">
      <g fill="#BE4A1E">
        <rect x="0" y="0" width="42" height="36" rx="6"/><rect x="48" y="0" width="42" height="36" rx="6"/><rect x="96" y="0" width="42" height="36" rx="6"/><rect x="144" y="0" width="42" height="36" rx="6" opacity=".55"/><rect x="192" y="0" width="42" height="36" rx="6" opacity=".55"/>
      </g>
      <g fill="#F5F0E8">
        <rect x="0" y="44" width="42" height="36" rx="6"/><rect x="48" y="44" width="42" height="36" rx="6"/><rect x="96" y="44" width="42" height="36" rx="6"/><rect x="144" y="44" width="42" height="36" rx="6"/><rect x="192" y="44" width="42" height="36" rx="6"/>
      </g>
      <rect x="240" y="0" width="30" height="80" rx="6" fill="#F5F0E8" opacity=".5"/>
      <text x="255" y="44" text-anchor="middle" font-size="9" fill="#6B6860" transform="rotate(-90 255 44)">weekend</text>
    </g>
    <text x="20" y="176" font-size="26" font-weight="800" fill="#0B0B0C">10 business days</text>
    <text x="20" y="214" font-size="12" fill="#6B6860">No incident needed to start this clock</text>
  </g>
  <!-- Nine domains strip -->
  <g transform="translate(40,286)">
    <rect width="640" height="148" rx="16" fill="#fff"/>
    <text x="20" y="30" font-size="12" font-weight="700" fill="#0B0B0C" letter-spacing="1.5">24 REQUIREMENTS · 9 DOMAINS · ¶13–36</text>
    <g font-size="11" font-weight="700" fill="#0B0B0C">
      <g transform="translate(20,48)"><rect width="190" height="26" rx="13" fill="#FBEFE8"/><circle cx="14" cy="13" r="5" fill="#10B981"/><text x="26" y="17">Roles</text></g>
      <g transform="translate(225,48)"><rect width="190" height="26" rx="13" fill="#FBEFE8"/><circle cx="14" cy="13" r="5" fill="#10B981"/><text x="26" y="17">Capability</text></g>
      <g transform="translate(430,48)"><rect width="190" height="26" rx="13" fill="#FBEFE8"/><circle cx="14" cy="13" r="5" fill="#10B981"/><text x="26" y="17">Policy framework</text></g>
      <g transform="translate(20,80)"><rect width="190" height="26" rx="13" fill="#FBEFE8"/><circle cx="14" cy="13" r="5" fill="#10B981"/><text x="26" y="17">Asset classification</text></g>
      <g transform="translate(225,80)"><rect width="190" height="26" rx="13" fill="#FBEFE8"/><circle cx="14" cy="13" r="5" fill="#F59E0B"/><text x="26" y="17">Controls</text></g>
      <g transform="translate(430,80)"><rect width="190" height="26" rx="13" fill="#FBEFE8"/><circle cx="14" cy="13" r="5" fill="#10B981"/><text x="26" y="17">Incident management</text></g>
      <g transform="translate(20,112)"><rect width="190" height="26" rx="13" fill="#FBEFE8"/><circle cx="14" cy="13" r="5" fill="#F59E0B"/><text x="26" y="17">Control testing</text></g>
      <g transform="translate(225,112)"><rect width="190" height="26" rx="13" fill="#FBEFE8"/><circle cx="14" cy="13" r="5" fill="#10B981"/><text x="26" y="17">Internal audit</text></g>
      <g transform="translate(430,112)"><rect width="190" height="26" rx="13" fill="#FBEFE8"/><circle cx="14" cy="13" r="5" fill="#BE4A1E"/><text x="26" y="17">APRA notification</text></g>
    </g>
  </g>
</svg>
