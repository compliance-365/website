<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="bg42001" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <!-- Gradient frame -->
  <rect width="960" height="420" rx="18" fill="url(#bg42001)"/>

  <!-- App surface -->
  <g transform="translate(36,36)">
    <rect width="888" height="348" rx="16" fill="#ffffff" stroke="#e8ebf5"/>

    <!-- Tabs -->
    <g transform="translate(24,18)">
      <rect width="150" height="28" rx="8" fill="#eef2ff" stroke="#dfe5ff"/>
      <rect x="162" width="168" height="28" rx="8" fill="#ffffff" stroke="#e8ebf5"/>
      <rect x="342" width="120" height="28" rx="8" fill="#ffffff" stroke="#e8ebf5"/>
      <rect x="474" width="160" height="28" rx="8" fill="#ffffff" stroke="#e8ebf5"/>
    </g>

    <!-- Left: donut chart (model inventory) -->
    <g transform="translate(150,182)">
      <circle r="78" fill="#fafbff" stroke="#e6e9f2"/>
      <circle r="78" fill="none" stroke="#c7d2fe" stroke-width="14"
              stroke-dasharray="245 245" transform="rotate(-90)"/>
      <circle r="78" fill="none" stroke="#a5f3fc" stroke-width="14"
              stroke-dasharray="140 350" transform="rotate(20)"/>
      <!-- center dot -->
      <circle r="10" fill="#4F46E5"/>
    </g>

    <!-- Right: policy/controls lanes -->
    <g transform="translate(380,86)">
      <rect width="468" height="56" rx="10" fill="#f9fbff" stroke="#e6e9f2"/>
      <rect y="74" width="468" height="56" rx="10" fill="#f9fbff" stroke="#e6e9f2"/>
      <rect y="148" width="468" height="56" rx="10" fill="#f9fbff" stroke="#e6e9f2"/>
      <!-- label chips -->
      <g fill="#e9eefc">
        <rect x="16" y="16" width="160" height="12" rx="6"/>
        <rect x="16" y="90" width="190" height="12" rx="6"/>
        <rect x="16" y="164" width="140" height="12" rx="6"/>
      </g>
      <!-- status pills -->
      <g>
        <rect x="376" y="14" width="76" height="28" rx="14" fill="#ecfdf5" stroke="#d1fae5"/>
        <rect x="376" y="88" width="76" height="28" rx="14" fill="#fff7ed" stroke="#ffedd5"/>
        <rect x="376" y="162" width="76" height="28" rx="14" fill="#eef2ff" stroke="#dfe5ff"/>
      </g>
    </g>
  </g>

  <!-- Caption -->
  <text x="56" y="386" font-family="system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif"
        font-size="18" fill="#4F46E5" font-weight="700">AI Governance Readiness (ISO 42001)</text>
</svg>
