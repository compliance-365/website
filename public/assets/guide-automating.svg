<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="ga-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9812E" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="ga-chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F5F0E8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" rx="18" fill="url(#ga-bg)"/>

  <!-- Canvas -->
  <g transform="translate(28,28)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <rect width="904" height="340" rx="14" fill="#fff" stroke="#F5F0E8"/>

    <!-- Title -->
    <text x="24" y="36" font-size="14" font-weight="700" fill="#A9812E">Automating Compliance</text>

    <!-- Central Microsoft 365 tile -->
    <g transform="translate(356,70)">
      <rect width="248" height="140" rx="14" fill="#fff" stroke="#F5F0E8"/>
      <text x="20" y="32" font-size="14" font-weight="700" fill="#0B0B0C">Microsoft 365</text>
      <rect x="20" y="48" width="208" height="12" rx="6" fill="#DDD8CF"/>
      <rect x="20" y="70" width="168" height="12" rx="6" fill="#F5F0E8"/>
      <text x="20" y="104" font-size="12" fill="#6B6860">Intune • Entra ID • Defender • Purview</text>
    </g>

    <!-- Dotted connectors -->
    <g stroke="#D8BA78" stroke-width="2" stroke-dasharray="6 6" fill="none">
      <path d="M480 210 C 520 250, 600 250, 660 224"/>
      <path d="M480 210 C 440 250, 360 250, 300 224"/>
      <path d="M480 210 C 480 250, 480 260, 480 296"/>
    </g>

    <!-- Azure block -->
    <g transform="translate(690,164)">
      <rect width="190" height="120" rx="12" fill="#fff" stroke="#F5F0E8"/>
      <rect x="14" y="14" width="60" height="24" rx="12" fill="#F5F0E8" stroke="#F5F0E8"/>
      <text x="24" y="30" font-size="12" font-weight="700" fill="#A9812E">Azure</text>
      <text x="16" y="60" font-size="12" fill="#0B0B0C">Policy assignments → evidence</text>
      <text x="16" y="80" font-size="12" fill="#0B0B0C">Key Vault configs → logs</text>
    </g>

    <!-- AWS block -->
    <g transform="translate(84,164)">
      <rect width="190" height="120" rx="12" fill="#fff" stroke="#F5F0E8"/>
      <rect x="14" y="14" width="56" height="24" rx="12" fill="#FFF7ED" stroke="#FED7AA"/>
      <text x="24" y="30" font-size="12" font-weight="700" fill="#9A3412">AWS</text>
      <text x="16" y="60" font-size="12" fill="#0B0B0C">IAM Access Analyzer → CSV</text>
      <text x="16" y="80" font-size="12" fill="#0B0B0C">Config snapshots → S3</text>
    </g>

    <!-- Bottom badges -->
    <g transform="translate(360,300)">
      <g transform="translate(-92,0)">
        <rect width="150" height="34" rx="17" fill="url(#ga-chip)" stroke="#F5F0E8"/>
        <circle cx="17" cy="17" r="8" fill="#10B981"/>
        <path d="M13 17l3 3 5-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="22" font-size="13" fill="#0B0B0C">Evidence</text>
      </g>
      <g transform="translate(74,0)">
        <rect width="160" height="34" rx="17" fill="url(#ga-chip)" stroke="#F5F0E8"/>
        <circle cx="17" cy="17" r="8" fill="#A9812E"/>
        <path d="M14 17h6M17 14v6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="32" y="22" font-size="13" fill="#0B0B0C">Access Reviews</text>
      </g>
      <g transform="translate(248,0)">
        <rect width="150" height="34" rx="17" fill="url(#ga-chip)" stroke="#F5F0E8"/>
        <circle cx="17" cy="17" r="8" fill="#0B0B0C"/>
        <path d="M12 17h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <text x="32" y="22" font-size="13" fill="#0B0B0C">Posture</text>
      </g>
    </g>

    <!-- Caption -->
    <text x="42" y="384" font-size="16" fill="#A9812E" font-weight="700">
      Automating Compliance in Microsoft 365, Azure &amp; AWS
    </text>
  </g>
</svg>
