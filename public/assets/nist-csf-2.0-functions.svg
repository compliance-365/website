<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400"
     role="img"
     aria-labelledby="title desc">
  <title id="title">NIST CSF 2.0 — 6 Core Functions</title>
  <desc id="desc">Circular radar with labels: Govern, Identify, Protect, Detect, Respond, Recover.</desc>

  <!-- Brand tokens -->
  <defs>
    <!-- Primary indigo → teal gradient -->
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Soft background tint -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" stop-opacity=".06"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity=".06"/>
    </linearGradient>
    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".10"/>
    </filter>
    <style>
      /* Use site font */
      @font-face { font-family: Nunito, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .label { font-family: Nunito, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill:#0f172a; }
      .muted { fill:#64748b; }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bg-grad)" stroke="#e6ebf5" stroke-width="1.25"/>

  <!-- Radar rings -->
  <g fill="none" stroke="#eef2ff" stroke-width="1">
    <circle cx="200" cy="200" r="160"/>
    <circle cx="200" cy="200" r="125"/>
    <circle cx="200" cy="200" r="90"/>
    <circle cx="200" cy="200" r="55"/>
  </g>

  <!-- Spokes (6) -->
  <g stroke="#e8ecf8" stroke-width="1.1">
    <line x1="200" y1="40"  x2="200" y2="200"/>  <!-- Govern -->
    <line x1="320" y1="95"  x2="200" y2="200"/>  <!-- Identify -->
    <line x1="360" y1="200" x2="200" y2="200"/>  <!-- Protect -->
    <line x1="320" y1="305" x2="200" y2="200"/>  <!-- Detect -->
    <line x1="200" y1="360" x2="200" y2="200"/>  <!-- Respond -->
    <line x1="80"  y1="305" x2="200" y2="200"/>  <!-- Recover -->
  </g>

  <!-- Function labels -->
  <g class="label" font-size="14" font-weight="800">
    <text x="200" y="22"  text-anchor="middle">Govern</text>
    <text x="338" y="92"  text-anchor="start">Identify</text>
    <text x="382" y="205" text-anchor="start">Protect</text>
    <text x="338" y="318" text-anchor="start">Detect</text>
    <text x="200" y="390" text-anchor="middle">Respond</text>
    <text x="62"  y="318" text-anchor="end">Recover</text>
  </g>

  <!-- Subtle highlight on GOVERN (new in 2.0) -->
  <path d="M200,40 L260,85 L255,135 L145,135 L140,85 Z"
        fill="url(#brand-grad)" opacity=".12" filter="url(#shadow)"/>
  <path d="M200,40 L260,85 L255,135 L145,135 L140,85 Z"
        fill="none" stroke="url(#brand-grad)" stroke-width="2"/>

  <!-- Center text -->
  <g text-anchor="middle" class="label">
    <text x="200" y="194" font-size="18" font-weight="900" fill="#4F46E5">NIST CSF 2.0</text>
    <text x="200" y="214" font-size="11" class="muted">6 Core Functions</text>
  </g>
</svg>
