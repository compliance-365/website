<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <clipPath id="irap-clip"><rect width="880" height="370" rx="10"/></clipPath>
  </defs>

  <rect width="880" height="370" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect width="880" height="48" fill="#f8fafc" clip-path="url(#irap-clip)"/>
  <line x1="0" y1="48" x2="880" y2="48" stroke="#e2e8f0"/>
  <text x="18" y="30" font-size="15" font-weight="700" fill="#0f172a">ISM Control Assessment Register</text>
  <text x="726" y="30" font-size="11" fill="#64748b">⊟ Edit in grid view</text>
  <text x="836" y="30" font-size="11" fill="#64748b">⇑ Export</text>

  <!-- Tabs -->
  <rect y="48" width="880" height="34" fill="#f8fafc"/>
  <line x1="0" y1="82" x2="880" y2="82" stroke="#e2e8f0"/>
  <rect x="14" y="57" width="84" height="22" rx="4" fill="#1e40af"/>
  <text x="56" y="72" font-size="10.5" fill="white" text-anchor="middle" font-weight="600">All Controls</text>
  <text x="118" y="72" font-size="10.5" fill="#64748b">PROTECTED</text>
  <text x="204" y="72" font-size="10.5" fill="#64748b">OFFICIAL</text>
  <text x="272" y="72" font-size="10.5" fill="#64748b">By Domain</text>
  <text x="348" y="72" font-size="10.5" fill="#1e40af">+ Add view</text>

